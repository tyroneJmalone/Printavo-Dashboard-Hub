# Merge paths/components into openapi.yaml before central code generation.
paths:
  /chipply/data/preview:
    post:
      operationId: previewChipplyData
      tags: [Chipply]
      summary: Review one bounded CSV/XLSX detailed Data Export without importing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "CSV/XLSX, maximum 5 MB, 10000 lines, one Sales Order" }
      responses:
        "200":
          description: Actor-bound preview expires after 30 minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChipplyDataPreview" }
        "400": { description: Invalid file or inconsistent repeating order money }
  /chipply/data/confirm:
    post:
      operationId: confirmChipplyData
      tags: [Chipply]
      summary: Atomically create/link store and activate reviewed complete snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previewId, replaceCurrent]
              properties:
                previewId: { type: string, format: uuid }
                replaceCurrent: { type: boolean, description: "Explicitly replace all current lines; missing rows are not merged. Previous versions remain auditable." }
      responses:
        "200":
          description: Confirmed snapshot; repeated current source hash is idempotent
          content:
            application/json:
              schema:
                type: object
                required: [storeId, snapshotId, idempotent]
                properties:
                  storeId: { type: string, format: uuid }
                  snapshotId: { type: string, format: uuid }
                  idempotent: { type: boolean }
        "409": { description: Expired/stale preview or replacement not explicitly authorized }
  /chipply/data/stores/{storeId}:
    get:
      operationId: getChipplyDataDetail
      tags: [Chipply]
      summary: Current source dollars and recomputed mirrored production attribution
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Chipply-only detailed snapshot, never Printavo invoice revenue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChipplyDataDetail" }
        "404": { description: Store has no detailed snapshot }
  /chipply/data/stores/{storeId}/overrides:
    post:
      operationId: reviewChipplyDataMatch
      tags: [Chipply]
      summary: Audit a manual candidate selection without overriding quantity/method evidence
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshotId, rowOrdinal, invoiceId, reason]
              properties:
                snapshotId: { type: string, format: uuid }
                rowOrdinal: { type: integer, minimum: 1 }
                invoiceId: { type: string, minLength: 1, maxLength: 100 }
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        "200":
          description: Updated detail; mismatched quantities still remain unallocated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChipplyDataDetail" }
        "409": { description: Stale snapshot or invoice not in same-event same-process candidates }
  /chipply/data/stores/{storeId}/split-review:
    post:
      operationId: reviewChipplySplit
      tags: [Chipply]
      summary: Preview, explicitly approve or revoke a Hub-only split-invoice review
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChipplySplitRequest" }
      responses:
        "200":
          description: Strict combined comparison and selection-bound evidence token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChipplySplitPreview" }
        "400": { description: Invalid input }
        "409": { description: "Stale evidence, concurrent review or ineligible selection" }
components:
  schemas:
    ChipplySplitRequest:
      type: object
      required: [snapshotId, processKey, invoiceIds, action, revision]
      properties:
        snapshotId: { type: string, format: uuid }
        processKey: { type: string }
        invoiceIds: { type: array, maxItems: 20, items: { type: string } }
        action: { type: string, enum: [preview, approve, revoke] }
        revision: { type: [string, "null"] }
        evidence: { type: string }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    ChipplySplitPreview:
      type: object
      required: [state, rows, issues, oneSizeNotes, eligible, actualMethod, invoices, evidence]
      properties:
        state: { type: string, enum: [matched, different, incomplete, stale] }
        rows: { type: array, items: { $ref: "#/components/schemas/ChipplyQuantityRow" } }
        issues: { type: array, items: { type: string } }
        oneSizeNotes: { type: array, items: { type: string } }
        eligible: { type: boolean }
        actualMethod: { type: [string, "null"] }
        invoices: { type: array, items: { $ref: "#/components/schemas/ChipplyDataInvoiceReference" } }
        evidence: { type: string }
    ChipplySplitReview:
      type: object
      required: [id, invoiceIds, action, reason, actor, createdAt, state]
      properties:
        id: { type: string }
        invoiceIds: { type: array, items: { type: string } }
        action: { type: string, enum: [approve, revoke] }
        reason: { type: string }
        actor: { type: string }
        createdAt: { type: string }
        state: { type: string, enum: [active, stale, revoked] }
    ChipplySplitHistoryEntry:
      type: object
      required: [id, processKey, invoiceIds, action, reason, actor, createdAt]
      properties:
        id: { type: string }
        processKey: { type: string }
        invoiceIds: { type: array, items: { type: string } }
        action: { type: string }
        reason: { type: string }
        actor: { type: string }
        createdAt: { type: string }
    ChipplyDataCentsMap:
      type: object
      additionalProperties: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
      description: "Exact safe-integer cents keyed by original financial column name. Do not sum overlapping components."
    ChipplyDataSummary:
      type: object
      required: [lineCount, orderCount, quantity, itemTotalCents, orderTotalCents, orderComponentsCents, unitComponentsExtendedCents]
      properties:
        lineCount: { type: integer }
        orderCount: { type: integer }
        quantity: { type: integer }
        itemTotalCents: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        orderTotalCents: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        orderComponentsCents: { $ref: "#/components/schemas/ChipplyDataCentsMap" }
        unitComponentsExtendedCents: { $ref: "#/components/schemas/ChipplyDataCentsMap" }
    ChipplyDataReconciliation:
      type: object
      required: [outcome, actualMethod, invoiceId, invoiceVisualId, candidateInvoices, candidateInvoiceIds, reason]
      properties:
        splitInvoices: { type: array, items: { $ref: "#/components/schemas/ChipplyDataInvoiceReference" } }
        outcome: { type: string, enum: [matched, reviewed, ambiguous, quantity-mismatch, incomplete, unmatched, unverified] }
        actualMethod: { type: [string, "null"], description: "screenprint, heat-transfer, embroidery, dtg, engraving, mixed-decoration (explicit MERCH MIXED status), or null (unallocated)" }
        invoiceId: { type: [string, "null"] }
        invoiceVisualId: { type: [integer, "null"] }
        candidateInvoices:
          type: array
          items: { $ref: "#/components/schemas/ChipplyDataInvoiceReference" }
        candidateInvoiceIds: { type: array, items: { type: string } }
        reason: { type: string }
    ChipplyDataInvoiceReference:
      type: object
      required: [invoiceId, visualId]
      properties:
        invoiceId: { type: string }
        visualId: { type: [integer, "null"] }
    ChipplyQuantityRow:
      type: object
      required: [style, color, size, expected, actual, delta, result]
      properties:
        style: { type: string }
        color: { type: string }
        size: { type: string }
        expected: { type: integer }
        actual: { type: integer }
        delta: { type: integer, description: "Mirrored Printavo minus Chipply" }
        result: { type: string, enum: [matched, missing, extra, different] }
    ChipplyQuantityCandidate:
      type: object
      required: [invoiceId, visualId, detailSyncedAt, sourceUpdatedAt, state, rows, issues, oneSizeNotes]
      properties:
        invoiceId: { type: string }
        visualId: { type: [integer, "null"] }
        detailSyncedAt: { type: [string, "null"] }
        sourceUpdatedAt: { type: [string, "null"] }
        state: { type: string, enum: [matched, different, incomplete, stale] }
        rows: { type: array, items: { $ref: "#/components/schemas/ChipplyQuantityRow" } }
        issues: { type: array, items: { type: string } }
        oneSizeNotes: { type: array, items: { type: string } }
    ChipplyProcessComparison:
      type: object
      required: [processKey, processNames, state, candidates]
      properties:
        splitEvidence: { type: string }
        splitRevision: { type: [string, "null"] }
        splitReview:
          anyOf:
            - { $ref: "#/components/schemas/ChipplySplitReview" }
            - { type: "null" }
        processKey: { type: string }
        processNames: { type: array, items: { type: string } }
        state: { type: string, enum: [single, ambiguous, unmatched] }
        candidates: { type: array, items: { $ref: "#/components/schemas/ChipplyQuantityCandidate" } }
    ChipplyDataLine:
      type: object
      required: [rowOrdinal, orderNumber, orderDate, processName, plannedMethod, style, color, size, productName, vendor, quantity, itemTotalCents, unitCents, reconciliation]
      properties:
        rowOrdinal: { type: integer, description: "Stable one-based row identity in immutable source snapshot; identical legitimate lines retained" }
        orderNumber: { type: string }
        orderDate: { type: string, format: date, description: "Export calendar date, no timezone shift" }
        processName: { type: string }
        plannedMethod: { type: [string, "null"] }
        style: { type: string }
        color: { type: string }
        size: { type: string }
        productName: { type: string }
        vendor: { type: string }
        quantity: { type: integer }
        itemTotalCents: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        unitCents: { $ref: "#/components/schemas/ChipplyDataCentsMap" }
        reconciliation: { $ref: "#/components/schemas/ChipplyDataReconciliation" }
    ChipplyDataPreview:
      type: object
      required: [previewId, expiresAt, salesOrder, storeName, sourceHash, existingStore, detectedInvoiceCount, currentSnapshotId, requiresReplacement, summary, lines, processComparisons, warnings]
      properties:
        previewId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        salesOrder: { type: string }
        storeName: { type: string }
        sourceHash: { type: string }
        existingStore:
          type: [object, "null"]
          required: [id, storeName]
          properties:
            id: { type: string, format: uuid }
            storeName: { type: string }
        detectedInvoiceCount: { type: integer }
        currentSnapshotId: { type: [string, "null"] }
        requiresReplacement: { type: boolean }
        processComparisons: { type: array, items: { $ref: "#/components/schemas/ChipplyProcessComparison" } }
        summary: { $ref: "#/components/schemas/ChipplyDataSummary" }
        lines: { type: array, items: { $ref: "#/components/schemas/ChipplyDataLine" } }
        warnings: { type: array, items: { type: string } }
    ChipplyDataOverride:
      type: object
      required: [rowOrdinal, invoiceId, reason, actor, createdAt]
      properties:
        rowOrdinal: { type: integer }
        invoiceId: { type: string }
        reason: { type: string }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
    ChipplyDataVersion:
      type: object
      required: [id, sourceHash, sourceName, createdAt, actor]
      properties:
        id: { type: string, format: uuid }
        sourceHash: { type: string }
        sourceName: { type: string }
        createdAt: { type: string, format: date-time }
        actor: { type: string }
    ChipplyDataDetail:
      type: object
      required: [storeId, snapshotId, sourceHash, salesOrder, storeName, sourceName, importedAt, summary, lines, processComparisons, overrides, versions, warnings]
      properties:
        splitHistory: { type: array, items: { $ref: "#/components/schemas/ChipplySplitHistoryEntry" } }
        storeId: { type: string, format: uuid }
        snapshotId: { type: string, format: uuid }
        sourceHash: { type: string }
        salesOrder: { type: string }
        storeName: { type: string }
        sourceName: { type: string }
        importedAt: { type: string, format: date-time }
        processComparisons: { type: array, items: { $ref: "#/components/schemas/ChipplyProcessComparison" } }
        summary: { $ref: "#/components/schemas/ChipplyDataSummary" }
        lines: { type: array, items: { $ref: "#/components/schemas/ChipplyDataLine" } }
        overrides: { type: array, items: { $ref: "#/components/schemas/ChipplyDataOverride" } }
        versions: { type: array, items: { $ref: "#/components/schemas/ChipplyDataVersion" } }
        warnings: { type: array, items: { type: string } }