                  type: object
                  additionalProperties: true
        "500":
          description: Carrier fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingError"

  # ============ Mint Bucks (shared LIVE standalone DB — see replit.md) ============
  /mintbucks/customers:
