    PqEvaluateAndRunRequest:
      type: object
      properties:
        orderIds:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 200
      required: [orderIds]
    PqEvaluateAndRunResponse:
      type: object
      properties:
        automationEnabled: { type: boolean }
        autoJobId: { type: ["string", "null"] }
        autoCount: { type: integer }
        askItems:
          type: array
          items:
            $ref: "#/components/schemas/PqRuleMatchItem"
        noChangeCount: { type: integer }
        alreadyInTargetCount: { type: integer }
        unmatchedCount: { type: integer }
      required:
        [
          automationEnabled,
          autoJobId,
          autoCount,
          askItems,
          noChangeCount,
          alreadyInTargetCount,
          unmatchedCount,
        ]
    PqJobLine:
      type: object
      properties:
        orderId: { type: string }
        visualId: { type: ["integer", "null"] }
        nickname: { type: ["string", "null"] }
        fromStatusId: { type: ["string", "null"] }
        fromStatusName: { type: ["string", "null"] }
        targetStatusId: { type: string }
        targetStatusName: { type: string }
        status: { type: string, enum: [pending, done, failed, stale, skipped] }
        error: { type: ["string", "null"] }
      required:
        [
          orderId,
          visualId,
          nickname,
          fromStatusId,
          fromStatusName,
          targetStatusId,
          targetStatusName,
          status,
          error,
        ]
    PqStatusJob:
      type: object
      description: "status: running | success | failed | interrupted (server restarted mid-job — unfinished lines are retryable)."
      properties:
        id: { type: string }
        trigger: { type: string, enum: [manual, ask, auto, autoprint] }
        status: { type: string, enum: [running, success, failed, interrupted] }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PqJobLine"
        createdAt: { type: string }
      required: [id, trigger, status, startedAt, finishedAt, lines, createdAt]
    PqStatusJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PqStatusJob"
      required: [jobs]
    PqJobLineInput:
      type: object
      properties:
        orderId: { type: string, minLength: 1 }
        targetStatusId: { type: string, minLength: 1 }
        expectedStatusId:
          type: ["string", "null"]
          description: Stale guard — the status the user confirmed FROM; if the order moved since, that line is skipped as stale.
      required: [orderId, targetStatusId, expectedStatusId]
    StartPqStatusJobRequest:
      type: object
      properties:
        trigger: { type: string, enum: [manual, ask] }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/PqJobLineInput"
      required: [trigger, lines]
    AutoPrintCategoryMapping:
      type: object
      properties:
        category: { type: string, minLength: 1 }
        statusId: { type: string, minLength: 1 }
        statusName: { type: string }
      required: [category, statusId, statusName]
    AutoPrintConfig:
      type: object
      description: Safety defaults are enabled=false AND dryRun=true — both must be flipped deliberately before anything physically prints.
      properties:
        enabled: { type: boolean }
        scheduleHours: { type: integer, minimum: 1, maximum: 24 }
        sourceStatusIds:
          type: array
          items: { type: string }
        errorStatusId: { type: ["string", "null"] }
        errorStatusName: { type: ["string", "null"] }
        printerId: { type: ["string", "null"] }
        printerName: { type: ["string", "null"] }
        copies: { type: integer, minimum: 1, maximum: 10 }
        dryRun: { type: boolean }
        categoryMappings:
          type: array
          items:
            $ref: "#/components/schemas/AutoPrintCategoryMapping"
      required:
        [
          enabled,
          scheduleHours,
          sourceStatusIds,
          errorStatusId,
          errorStatusName,
          printerId,
          printerName,
          copies,
          dryRun,
          categoryMappings,
        ]
    AutoPrintPrinter:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        state: { type: string }
        computerName: { type: ["string", "null"] }
        computerState: { type: ["string", "null"] }
      required: [id, name, state, computerName, computerState]
    AutoPrintPrintersResponse:
      type: object
      properties:
        configured: { type: boolean }
        printers:
          type: array
          items:
            $ref: "#/components/schemas/AutoPrintPrinter"
      required: [configured, printers]
    AutoPrintCategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          items: { type: string }
      required: [categories]
    StartAutoPrintRunRequest:
      type: object
      properties:
        dryRun:
          type: ["boolean", "null"]
          description: Overrides the config dryRun flag for this run only; null/omitted uses the config value.
      required: [dryRun]
    AutoPrintRunCounts:
      type: object
      properties:
        candidates: { type: integer }
        alreadyPrinted: { type: integer }
        detailPending: { type: integer }
        deferred: { type: integer }
        printed: { type: integer }
        failed: { type: integer }
        dryRun: { type: integer }
      required:
        [candidates, alreadyPrinted, detailPending, deferred, printed, failed, dryRun]
    AutoPrintRun:
      type: object
      description: "status: running | success | failed | interrupted (server restarted mid-run — printed orders are already persisted, the rest retry next run)."
      properties:
        id: { type: string }
        trigger: { type: string, enum: [scheduled, manual] }
        dryRun: { type: boolean }
        status: { type: string, enum: [running, success, failed, interrupted] }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        counts:
          $ref: "#/components/schemas/AutoPrintRunCounts"
        error: { type: ["string", "null"] }
        advanceJobId:
          type: ["string", "null"]
          description: Id of the status-change job started after printing (poll /print-queue/status-jobs/{id}).
        advanceSkipped: { type: ["string", "null"] }
        createdAt: { type: string }
      required:
        [
          id,
          trigger,
          dryRun,
          status,
          startedAt,
          finishedAt,
          counts,
          error,
          advanceJobId,
          advanceSkipped,
          createdAt,
        ]
    AutoPrintRunsResponse:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/AutoPrintRun"
      required: [runs]
    AutoPrintJob:
      type: object
      description: "status: pending | printed | failed | dry_run | skipped. Printed rows are the dedup source — an order matching by printavoOrderId OR visualId never auto-prints twice."
      properties:
        id: { type: string }
        runId: { type: string }
        orderId: { type: string }
        visualId: { type: ["integer", "null"] }
        nickname: { type: ["string", "null"] }
        docType: { type: string }
        sourceStatusId: { type: ["string", "null"] }
        sourceStatusName: { type: ["string", "null"] }
        targetStatusId: { type: ["string", "null"] }
        targetStatusName: { type: ["string", "null"] }
        printnodeJobId: { type: ["string", "null"] }
        printerName: { type: ["string", "null"] }
        copies: { type: integer }
        status: { type: string, enum: [pending, printed, failed, dry_run, skipped] }
        errorMessage: { type: ["string", "null"] }
        isReprint: { type: boolean }
        printedAt: { type: ["string", "null"] }
        createdAt: { type: string }
      required:
        [
          id,
          runId,
          orderId,
          visualId,
          nickname,
          docType,
          sourceStatusId,
          sourceStatusName,
          targetStatusId,
          targetStatusName,
          printnodeJobId,
          printerName,
          copies,
          status,
          errorMessage,
          isReprint,
          printedAt,
          createdAt,
        ]
    AutoPrintJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/AutoPrintJob"
      required: [jobs]
