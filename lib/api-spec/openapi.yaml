      tags: [printQueue]
      summary: Enable/disable all Print Queue after-print automation (manual presets keep working)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PqAutomationSetting"
      responses:
        "200":
          description: Saved setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqAutomationSetting"
  /print-queue/rules/evaluate-and-run:
    post:
      operationId: evaluatePqRulesAndRun
      tags: [printQueue]
      summary: Evaluate Print Queue rules for just-printed orders; auto-mode matches start a job server-side, ask-mode matches are returned for confirmation
      description: >
        Enforces the master automation switch server-side — when it is off
        nothing is evaluated and nothing runs. Auto matches are started as a
        background status job in the SAME call so a closed browser tab cannot
        strand them; ask matches are returned for an ephemeral confirm panel
        (confirmed items go to POST /print-queue/status-jobs with a per-order
        stale guard).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PqEvaluateAndRunRequest"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqEvaluateAndRunResponse"
        "400":
          description: Missing / too many order ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /print-queue/status-jobs:
    get:
      operationId: listPqStatusJobs
      tags: [printQueue]
      summary: Recent Print Queue status-change jobs, newest first (interrupted jobs surface as retryable)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqStatusJobsResponse"
    post:
      operationId: startPqStatusJob
      tags: [printQueue]
      summary: Start a background bulk status-change job (one at a time; per-order stale guard; writes via the throttled gateway)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPqStatusJobRequest"
      responses:
        "202":
          description: Job started — poll GET /print-queue/status-jobs/{id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqStatusJob"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another status job is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Printavo credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /print-queue/status-jobs/{id}:
    get:
      operationId: getPqStatusJob
      tags: [printQueue]
      summary: Poll a status-change job's per-order progress
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqStatusJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
