          id,
          priority,
          enabled,
          name,
          sourceStatusIds,
          decoGroup,
          specialMixedDeco,
          dueComparator,
          dueBusinessDays,
          targetStatusId,
          targetStatusName,
          mode,
          createdAt,
          updatedAt,
