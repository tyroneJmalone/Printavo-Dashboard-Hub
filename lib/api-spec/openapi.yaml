          type: ["string", "null"]
          description: Vendor's order/confirmation number, recorded when the PO is marked submitted.
        locked: { type: boolean }
        lockReason:
          type: ["string", "null"]
          enum: [printavo, vendor, null]
          description: Why the PO is locked — "vendor" locks need the admin unlock (PIN), "printavo" locks can be manually unlocked.
        pushState:
          anyOf:
            - $ref: "#/components/schemas/PoPushState"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, poNumber, vendorName, notes, totalQuantity, totalCost, lineItems, pushedToPrintavoAt, submittedToVendorAt, vendorOrderNumber, locked, lockReason, pushState, createdAt, updatedAt]
