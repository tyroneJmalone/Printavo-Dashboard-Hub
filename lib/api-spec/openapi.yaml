          in: query
          required: true
          schema: { type: string, enum: [email, company] }
      responses:
        "200":
          description: Matching orders, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderPortalOrderList"
        "400":
          description: Invalid search
  /reorder-portal/requests:
    post:
      operationId: submitReorderRequest
      tags: [reorderPortal]
      summary: Submit a reorder request
      description: Public endpoint — stores the request and emails the sales team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequestInput"
      responses:
        "201":
          description: Request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderRequestSubmitResult"
        "400":
          description: Invalid request
        "429":
          description: Too many requests
  /reorder-requests:
    get:
      operationId: listReorderRequests
      tags: [reorderRequests]
      summary: List reorder requests (staff inbox)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [new, in_progress, done, all] }
      responses:
        "200":
          description: Requests + status counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderRequestList"
  /reorder-requests/{id}:
    patch:
      operationId: updateReorderRequest
      tags: [reorderRequests]
      summary: Update a reorder request's status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReorderRequestInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderRequestRecord"
        "404":
          description: Not found
components:
  parameters:
    CustomerIdParam:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^\d+$' }
    ArtworkBookmarkIdParam:
      name: bookmarkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DropboxLocatorParam:
      name: locator
      in: query
      required: true
      description: A contained Dropbox path, the linked root id, or an id already bookmarked for this customer
      schema: { type: string, minLength: 1, maxLength: 1000 }
    OrderTypeParam:
      name: orderType
      in: query
      required: false
      schema: { type: string, enum: [invoice, quote, all] }
    StatusesParam:
      name: statuses
      in: query
      required: false
      description: "||-separated status names"
      schema: { type: string }
    BrandsParam:
      name: brands
      in: query
      required: false
      schema: { type: string }
    CategoriesParam:
      name: categories
      in: query
      required: false
      schema: { type: string }
    StyleNumbersParam:
      name: styleNumbers
      in: query
      required: false
      schema: { type: string }
    ColorsParam:
      name: colors
      in: query
      required: false
      schema: { type: string }
    CreatedStartParam:
      name: createdStart
      in: query
      required: false
      description: "YYYY-MM-DD, record-created basis (ET)"
      schema: { type: string }
    CreatedEndParam:
      name: createdEnd
      in: query
      required: false
      schema: { type: string }
    InvoiceStartParam:
      name: invoiceStart
      in: query
      required: false
      description: "YYYY-MM-DD, invoice-date basis"
      schema: { type: string }
    InvoiceEndParam:
      name: invoiceEnd
      in: query
      required: false
      schema: { type: string }
    ProductionDueStartParam:
      name: productionDueStart
      in: query
      required: false
      description: "YYYY-MM-DD, production-due basis (ET)"
      schema: { type: string }
    ProductionDueEndParam:
      name: productionDueEnd
      in: query
      required: false
      schema: { type: string }
    DueStartParam:
      name: dueStart
      in: query
      required: false
      description: "YYYY-MM-DD, customer-due basis (ET)"
      schema: { type: string }
    DueEndParam:
      name: dueEnd
      in: query
      required: false
      schema: { type: string }
    MinQtyParam:
      name: minQty
      in: query
      required: false
      schema: { type: number }
    MaxQtyParam:
      name: maxQty
      in: query
      required: false
      schema: { type: number }
    MinTotalParam:
      name: minTotal
      in: query
      required: false
      schema: { type: number }
    MaxTotalParam:
      name: maxTotal
      in: query
      required: false
      schema: { type: number }
    SearchParam:
      name: search
      in: query
      required: false
      schema: { type: string }
    ExcludeParam:
      name: exclude
      in: query
      required: false
      description: "||-separated filter keys to invert (statuses, brands, categories, styleNumbers, colors)"
      schema: { type: string }
    ActivityOnlyParam:
      name: activityOnly
      in: query
      required: false
      description: Keep only orders with qualifying recorded activity in the selected activity window
      schema: { type: boolean }
    ActivityStartParam:
      name: activityStart
      in: query
      required: false
      description: Inclusive shop-local activity date (YYYY-MM-DD)
      schema: { type: string }
    ActivityEndParam:
      name: activityEnd
      in: query
      required: false
      description: Inclusive shop-local activity date (YYYY-MM-DD)
      schema: { type: string }
    ActivityOwnerParam:
      name: activityOwner
      in: query
      required: false
      description: Current invoice/quote owner email
      schema: { type: string }
  schemas:
    ReorderPortalSizeCount:
      type: object
      required: [size, label, count]
      properties:
        size: { type: string, description: "Raw Printavo size key, e.g. size_2xl" }
        label: { type: string, description: "Display label, e.g. 2XL" }
        count: { type: integer }
    ReorderPortalLineItem:
      type: object
      required: [id, itemNumber, color, description, totalQty, sizes, mockupUrls]
      properties:
        id: { type: string }
        itemNumber: { type: [string, "null"] }
        color: { type: [string, "null"] }
        description: { type: [string, "null"] }
        totalQty: { type: integer }
        sizes:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ReorderPortalSizeCount" }
        mockupUrls:
          type: array
          maxItems: 20
          items: { type: string }
    ReorderPortalOrder:
      type: object
      required: [id, visualId, nickname, statusName, statusColor, total, invoiceDate, customerCompany, mockupUrls, lineItems]
      properties:
        id: { type: string }
        visualId: { type: [integer, "null"] }
        nickname: { type: [string, "null"] }
        statusName: { type: [string, "null"] }
        statusColor: { type: [string, "null"] }
        total: { type: [number, "null"] }
        invoiceDate:
          type: [string, "null"]
          description: "YYYY-MM-DD (UTC calendar date)"
        customerCompany: { type: [string, "null"] }
        mockupUrls:
          type: array
          maxItems: 30
          items: { type: string }
        lineItems:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ReorderPortalLineItem" }
    ReorderPortalOrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ReorderPortalOrder" }
    ReorderRequestSizeQty:
      type: object
      required: [label, qty]
      properties:
        label: { type: string, maxLength: 40 }
        qty: { type: integer, minimum: 1, maximum: 100000 }
    ReorderRequestItem:
      type: object
      required: [description, sizes]
      properties:
        lineItemId: { type: [string, "null"], maxLength: 100 }
        itemNumber: { type: [string, "null"], maxLength: 200 }
        color: { type: [string, "null"], maxLength: 200 }
        description: { type: [string, "null"], maxLength: 500 }
        sizes:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/ReorderRequestSizeQty" }
    ReorderRequestInput:
      type: object
      required: [orderId, customerName, customerEmail, items]
      properties:
        orderId: { type: string, minLength: 1, maxLength: 100 }
        visualId: { type: [integer, "null"] }
        orderNickname: { type: [string, "null"], maxLength: 500 }
        customerName: { type: string, minLength: 1, maxLength: 200 }
        customerEmail: { type: string, format: email, maxLength: 320 }
        customerCompany: { type: [string, "null"], maxLength: 300 }
        notes: { type: [string, "null"], maxLength: 5000 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ReorderRequestItem" }
    ReorderRequestSubmitResult:
      type: object
      required: [ok, id]
      properties:
        ok: { type: boolean }
        id: { type: string, format: uuid }
    ReorderRequestRecord:
      type: object
      required: [id, createdAt, orderId, visualId, orderNickname, customerName, customerEmail, customerCompany, notes, items, totalQty, status, emailSent]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        orderId: { type: string }
        visualId: { type: [integer, "null"] }
        orderNickname: { type: [string, "null"] }
        customerName: { type: string }
        customerEmail: { type: string }
        customerCompany: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ReorderRequestItem" }
        totalQty: { type: integer }
        status: { type: string, enum: [new, in_progress, done] }
        emailSent: { type: boolean }
    ReorderRequestList:
      type: object
      required: [requests, counts]
      properties:
        requests:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReorderRequestRecord" }
        counts:
          type: object
          required: [new, inProgress, done]
          properties:
            new: { type: integer }
            inProgress: { type: integer }
            done: { type: integer }
    UpdateReorderRequestInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [new, in_progress, done] }
    AuditFields:
      type: object
      required: [createdByEmail, updatedByEmail, createdAt, updatedAt]
      properties:
        createdByEmail: { type: string }
        updatedByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BrandingColor:
      type: object
      required: [id, name, hex, active, pantoneCode, cmyk, inkReferences, threadReferences, inkStockNotes, threadStockNotes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        active: { type: boolean }
        pantoneCode: { type: [string, "null"] }
        cmyk:
          type: [string, "null"]
          description: Free-text CMYK breakdown, e.g. "60, 0, 100, 7"
        inkReferences: { type: [string, "null"] }
        threadReferences: { type: [string, "null"] }
        inkStockNotes: { type: [string, "null"] }
        threadStockNotes: { type: [string, "null"] }
        createdByEmail: { type: string }
        updatedByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BrandingColorList:
      type: object
      required: [colors]
      properties:
        colors:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/BrandingColor" }
    CreateBrandingColorRequest:
      type: object
      required: [name, hex]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        pantoneCode: { type: [string, "null"], maxLength: 60 }
        cmyk: { type: [string, "null"], maxLength: 60 }
        inkReferences: { type: [string, "null"], maxLength: 500 }
        threadReferences: { type: [string, "null"], maxLength: 500 }
        inkStockNotes: { type: [string, "null"], maxLength: 2000 }
        threadStockNotes: { type: [string, "null"], maxLength: 2000 }
    UpdateBrandingColorRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        active: { type: boolean }
        pantoneCode: { type: [string, "null"], maxLength: 60 }
        cmyk: { type: [string, "null"], maxLength: 60 }
        inkReferences: { type: [string, "null"], maxLength: 500 }
        threadReferences: { type: [string, "null"], maxLength: 500 }
        inkStockNotes: { type: [string, "null"], maxLength: 2000 }
        threadStockNotes: { type: [string, "null"], maxLength: 2000 }
    CustomerBrandingColorAssignment:
      type: object
      required: [role, colorId]
      properties:
        role: { type: string, minLength: 1, maxLength: 80 }
        colorId: { type: string, format: uuid }
    BrandingTypographyInput:
      type: object
      required: [role, fontName]
      properties:
        role: { type: string, minLength: 1, maxLength: 80 }
        fontName: { type: string, minLength: 1, maxLength: 120 }
        capitalization: { type: [string, "null"], maxLength: 120 }
        usageNotes: { type: [string, "null"], maxLength: 2000 }
    BrandingTypographyEntry:
      type: object
      required: [id, role, fontName, capitalization, usageNotes, status, updatedByEmail, updatedAt, retiredAt, retiredByEmail]
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        fontName: { type: string }
        capitalization: { type: [string, "null"] }
        usageNotes: { type: [string, "null"] }
        status: { type: string, enum: [current, retired] }
        updatedByEmail: { type: string }
        updatedAt: { type: string, format: date-time }
        retiredAt: { type: [string, "null"], format: date-time }
        retiredByEmail: { type: [string, "null"] }
    CustomerBrandingColor:
      type: object
      required: [assignmentId, role, status, colorId, name, hex, pantoneCode, cmyk, inkReferences, threadReferences, inkStockNotes, threadStockNotes, colorActive, updatedByEmail, updatedAt, retiredAt, retiredByEmail]
      properties:
        assignmentId: { type: string, format: uuid }
        role: { type: string }
        status: { type: string, enum: [current, retired] }
        colorId: { type: string, format: uuid }
        name: { type: string }
        hex: { type: string }
        pantoneCode: { type: [string, "null"] }
        cmyk: { type: [string, "null"] }
        inkReferences: { type: [string, "null"] }
        threadReferences: { type: [string, "null"] }
        inkStockNotes: { type: [string, "null"] }
        threadStockNotes: { type: [string, "null"] }
        colorActive: { type: boolean }
        updatedByEmail: { type: string }
        updatedAt: { type: string, format: date-time }
        retiredAt: { type: [string, "null"], format: date-time }
        retiredByEmail: { type: [string, "null"] }
    BrandingEvent:
      type: object
      required: [id, area, summary, actorEmail, createdAt]
      properties:
        id: { type: string, format: uuid }
        area: { type: string, enum: [colors, typography, notes, logos] }
        summary: { type: string }
        actorEmail: { type: string }
        createdAt: { type: string, format: date-time }
    CustomerBranding:
      type: object
      required: [configured, notes, colors, typography, events, audit]
      properties:
        configured: { type: boolean }
        notes: { type: [string, "null"] }
        colors:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CustomerBrandingColor" }
        typography:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/BrandingTypographyEntry" }
        events:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/BrandingEvent" }
        audit:
          oneOf:
            - $ref: "#/components/schemas/AuditFields"
            - type: "null"
    CustomerBrandingUpdate:
      type: object
      required: [notes, colors, typography]
      properties:
        notes: { type: [string, "null"], maxLength: 10000 }
        colors:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CustomerBrandingColorAssignment" }
        typography:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/BrandingTypographyInput" }
    DropboxFolderLinkRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1000
          description: Dropbox folder path or id; resolved and canonicalized server-side
    DropboxEntry:
      type: object
      required: [type, id, name, pathLower, pathDisplay, size, modifiedAt]
      properties:
        type: { type: string, enum: [file, folder] }
        id: { type: string }
        name: { type: string }
        pathLower: { type: [string, "null"] }
        pathDisplay: { type: [string, "null"] }
        size: { type: [integer, "null"] }
        modifiedAt: { type: [string, "null"], format: date-time }
    DropboxEntryList:
      type: object
      required: [linked, entries, truncated, cursor]
      properties:
        linked: { type: boolean }
        entries:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DropboxEntry" }
        truncated: { type: boolean }
        cursor: { type: [string, "null"], format: uuid }
    ArtworkUseCase:
      type: string
      enum: [light_background, dark_background, print, embroidery, web, restricted]
    ArtworkBookmarkRequest:
      type: object
      required: [path, label]
      properties:
        path: { type: string, minLength: 1, maxLength: 1000 }
        label: { type: string, minLength: 1, maxLength: 160 }
        notes: { type: [string, "null"], maxLength: 5000 }
        preferred: { type: boolean, default: false }
        retired: { type: boolean, default: false }
        useCases:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/ArtworkUseCase" }
    ArtworkBookmarkUpdate:
      type: object
      minProperties: 1
      properties:
        label: { type: string, minLength: 1, maxLength: 160 }
        notes: { type: [string, "null"], maxLength: 5000 }
        preferred: { type: boolean }
        retired: { type: boolean }
        useCases:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/ArtworkUseCase" }
    ArtworkBookmark:
      type: object
      required: [id, dropboxId, pathLower, pathDisplay, name, label, preferred, retired, useCases, printavoOrderId]
      properties:
        id: { type: string, format: uuid }
        dropboxId: { type: string }
        pathLower: { type: string }
        pathDisplay: { type: string }
        name: { type: string }
        label: { type: string }
        notes: { type: [string, "null"] }
        preferred: { type: boolean }
        retired: { type: boolean }
        useCases:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/ArtworkUseCase" }
        printavoOrderId: { type: [string, "null"] }
        createdByEmail: { type: string }
        updatedByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerDropboxFolder:
      type: object
      required: [dropboxId, pathLower, pathDisplay, name, createdByEmail, updatedByEmail, createdAt, updatedAt]
      properties:
        dropboxId: { type: string }
        pathLower: { type: string }
        pathDisplay: { type: string }
        name: { type: string }
        createdByEmail: { type: string }
        updatedByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerArtwork:
      type: object
      required: [linked, folder, bookmarks]
      properties:
        linked: { type: boolean }
        folder:
          oneOf:
            - $ref: "#/components/schemas/CustomerDropboxFolder"
            - type: "null"
        bookmarks:
          type: array
          maxItems: 250
          items: { $ref: "#/components/schemas/ArtworkBookmark" }
    PrintavoLinkStatus:
      type: object
      properties:
        available:
          type: boolean
          description: Whether Printavo is configured on the server
        linked: { type: boolean }
        origin: { type: string, nullable: true, enum: [printavo, momintum, null] }
        printavoTaskId: { type: string, nullable: true }
        previouslyLinked:
          type: boolean
          description: A suppressed link exists (twin was deleted once) — re-send is blocked
      required: [available, linked, origin, printavoTaskId, previouslyLinked]
    SendToPrintavoResult:
      type: object
      properties:
        printavoTaskId: { type: string }
        matchedAssignee:
          type: boolean
          description: False when the task was created unassigned in Printavo
        assigneeEmail: { type: string, nullable: true }
      required: [printavoTaskId, matchedAssignee, assigneeEmail]
    AuthMe:
      type: object
      properties:
        email: { type: string }
        role: { type: string, enum: [admin, manager, staff] }
        capabilities:
          type: array
          items: { type: string }
        enabledModules:
          type: array
          items: { type: string }
          description: Module keys this user may see/use (admins get every key)
      required: [email, role, capabilities, enabledModules]
    ModuleAccessModule:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        group: { type: string }
        enabled: { type: boolean }
      required: [key, label, group, enabled]
    ModuleAccessResponse:
      type: object
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleAccessModule"
      required: [modules]
    UpdateModuleAccessRequest:
      type: object
      properties:
        enabled:
          type: array
          items: { type: string }
          description: Full list of enabled module keys (replaces current set)
      required: [enabled]
    AuthForbidden:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
      required: [error]
    StaffMember:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, manager, staff] }
        addedByEmail: { type: string, nullable: true }
        linked:
          type: boolean
          description: Whether this person has signed in at least once in this environment
        createdAt: { type: string }
      required: [id, email, role, addedByEmail, linked, createdAt]
    StaffListResponse:
      type: object
      properties:
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
      required: [staff]
    AddStaffRequest:
      type: object
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        role: { type: string, enum: [admin, manager, staff] }
      required: [email, role]
    UpdateStaffRoleRequest:
      type: object
      properties:
        role: { type: string, enum: [admin, manager, staff] }
      required: [role]
    AdminPinStatus:
      type: object
      properties:
        configured: { type: boolean }
        source:
          type: string
          enum: [database, secret]
          nullable: true
          description: Where the active PIN lives — app database or the ADMIN_PIN secret fallback
      required: [configured, source]
    SetAdminPinRequest:
      type: object
      properties:
        currentPin: { type: string, maxLength: 64 }
        newPin: { type: string, minLength: 4, maxLength: 12 }
      required: [newPin]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SyncCounts:
      type: object
      properties:
        orders: { type: integer }
        quotes: { type: integer }
        invoices: { type: integer }
        customers: { type: integer }
        contacts: { type: integer }
        statuses: { type: integer }
        changeEvents: { type: integer }
      required: [orders, quotes, invoices, customers, contacts, statuses, changeEvents]
    SyncRunInfo:
      type: object
      properties:
        id: { type: integer }
        runType: { type: string }
        status: { type: string }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        stats:
          type: ["object", "null"]
          additionalProperties: true
        error: { type: ["string", "null"] }
      required: [id, runType, status, startedAt, finishedAt, stats, error]
    WatermarkInfo:
      type: object
      properties:
        entity: { type: string }
        watermark: { type: string }
      required: [entity, watermark]
    SchedulerState:
