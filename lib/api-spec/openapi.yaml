    post:
      operationId: previewKnowledgeMerge
      tags: [knowledge]
      summary: Generate an AI knowledge merge draft preview (admin only)
      description: Reads the full selected entries and generates one editable draft candidate. The originals are not changed. Conflicts must be preserved and explicitly flagged; the returned snapshot token is required to commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeMergePreviewInput"
      responses:
        "200":
          description: Editable AI merge preview and server snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeMergePreviewResponse"
        "400":
          description: Invalid selection
        "409":
          description: A selected entry is missing
        "429":
          description: Merge already in progress or rate limited
        "503":
          description: AI merge unavailable
  /knowledge/entries/merge/commit:
    post:
      operationId: commitKnowledgeMerge
      tags: [knowledge]
      summary: Commit an edited AI knowledge merge draft (admin only)
      description: Atomically creates one draft, transfers all source links, and deletes the originals only when every selected entry still matches the preview snapshot. The new entry is never automatically approved.
