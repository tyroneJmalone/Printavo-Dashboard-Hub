components:
  parameters:
    OrderTypeParam:
      name: orderType
      in: query
      required: false
      schema: { type: string, enum: [invoice, quote, all] }
    StatusesParam:
      name: statuses
      in: query
      required: false
      description: "||-separated status names"
      schema: { type: string }
    BrandsParam:
      name: brands
      in: query
      required: false
      schema: { type: string }
    CategoriesParam:
      name: categories
      in: query
      required: false
      schema: { type: string }
    StyleNumbersParam:
      name: styleNumbers
      in: query
      required: false
      schema: { type: string }
    ColorsParam:
      name: colors
      in: query
      required: false
      schema: { type: string }
    CreatedStartParam:
      name: createdStart
      in: query
      required: false
      description: "YYYY-MM-DD, record-created basis (ET)"
      schema: { type: string }
    CreatedEndParam:
      name: createdEnd
      in: query
      required: false
      schema: { type: string }
    InvoiceStartParam:
      name: invoiceStart
      in: query
      required: false
      description: "YYYY-MM-DD, invoice-date basis"
      schema: { type: string }
    InvoiceEndParam:
      name: invoiceEnd
      in: query
      required: false
      schema: { type: string }
    ProductionDueStartParam:
      name: productionDueStart
      in: query
      required: false
      description: "YYYY-MM-DD, production-due basis (ET)"
      schema: { type: string }
    ProductionDueEndParam:
      name: productionDueEnd
      in: query
      required: false
      schema: { type: string }
    DueStartParam:
      name: dueStart
      in: query
      required: false
      description: "YYYY-MM-DD, customer-due basis (ET)"
      schema: { type: string }
    DueEndParam:
      name: dueEnd
      in: query
      required: false
      schema: { type: string }
    MinQtyParam:
      name: minQty
      in: query
      required: false
      schema: { type: number }
    MaxQtyParam:
      name: maxQty
      in: query
      required: false
      schema: { type: number }
    MinTotalParam:
      name: minTotal
      in: query
      required: false
      schema: { type: number }
    MaxTotalParam:
      name: maxTotal
      in: query
      required: false
      schema: { type: number }
    SearchParam:
      name: search
      in: query
      required: false
      schema: { type: string }
    ExcludeParam:
      name: exclude
      in: query
      required: false
      description: "||-separated filter keys to invert (statuses, brands, categories, styleNumbers, colors)"
      schema: { type: string }
  schemas:
    AuthMe:
      type: object
      properties:
        email: { type: string }
        role: { type: string, enum: [admin, staff] }
      required: [email, role]
    AuthForbidden:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
      required: [error]
    StaffMember:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, staff] }
        addedByEmail: { type: string, nullable: true }
        linked:
          type: boolean
          description: Whether this person has signed in at least once in this environment
        createdAt: { type: string }
      required: [id, email, role, addedByEmail, linked, createdAt]
    StaffListResponse:
      type: object
      properties:
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
      required: [staff]
    AddStaffRequest:
      type: object
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        role: { type: string, enum: [admin, staff] }
      required: [email, role]
    UpdateStaffRoleRequest:
      type: object
      properties:
        role: { type: string, enum: [admin, staff] }
      required: [role]
    AdminPinStatus:
      type: object
      properties:
        configured: { type: boolean }
        source:
          type: string
          enum: [database, secret]
          nullable: true
          description: Where the active PIN lives — app database or the ADMIN_PIN secret fallback
      required: [configured, source]
    SetAdminPinRequest:
      type: object
      properties:
        currentPin: { type: string, maxLength: 64 }
        newPin: { type: string, minLength: 4, maxLength: 12 }
      required: [newPin]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SyncCounts:
      type: object
      properties:
        orders: { type: integer }
        quotes: { type: integer }
        invoices: { type: integer }
        customers: { type: integer }
        contacts: { type: integer }
        statuses: { type: integer }
        changeEvents: { type: integer }
      required: [orders, quotes, invoices, customers, contacts, statuses, changeEvents]
    SyncRunInfo:
      type: object
      properties:
        id: { type: integer }
        runType: { type: string }
        status: { type: string }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        stats:
          type: ["object", "null"]
          additionalProperties: true
        error: { type: ["string", "null"] }
      required: [id, runType, status, startedAt, finishedAt, stats, error]
    WatermarkInfo:
      type: object
      properties:
        entity: { type: string }
