  /shipping/rates:
    post:
      operationId: shippingGetRates
      tags: [shipping]
      summary: Get live shipping rates from ShipStation and/or EasyPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateRequest"
      responses:
        "200":
          description: Rates grouped by source and carrier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingError"
        "500":
          description: Rate fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingError"

  /shipping/carriers:
    get:
      operationId: shippingListCarriers
      tags: [shipping]
