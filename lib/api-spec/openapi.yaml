        "429":
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI returned an invalid extraction or grounded response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
