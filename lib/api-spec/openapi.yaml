  /hub/invoices/search:
    get:
      operationId: searchHubInvoices
      tags: [hub]
      summary: Exact invoice-number search from the local pv_orders mirror
      description: >
        Search invoices by visible order number (visualId). Supports exact
        match or typeahead prefix (up to 20 results). Returns only invoices
        (not quotes). Results come from the local mirror — no live Printavo
        call is made.
      parameters:
        - name: q
          in: query
          required: true
          description: Exact or prefix invoice number (digits only)
          schema: { type: string, minLength: 1, maxLength: 20 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Matching invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubInvoiceSearchResponse"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /hub/pricing/interpret:
    post:
      operationId: interpretHubPricingPrompt
      tags: [hub]
      summary: AI interpretation of a natural-language pricing calculator prompt
      description: >
        Uses AI to extract garment, decoration, cost, and pricing facts from
        a free-text prompt and maps them to pricing calculator fields. No
        persistence and no Printavo write. Exact vendor product match only —
        fails closed on ambiguous or fuzzy products. Returns editable
        calculator fill values plus warnings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubPricingInterpretRequest"
      responses:
        "200":
          description: Extracted calculator fill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubPricingInterpretResult"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /hub/uploads/request-png-url:
    post:
      operationId: requestHubPngUploadUrl
      tags: [hub]
      summary: Request a presigned PUT URL to upload a calculator PNG to App Storage
      description: >
        Returns a short-lived presigned PUT URL the client uses to upload a
        PNG directly to GCS. Size is capped at 10 MB. An upload row is
        created immediately so the push endpoint can reference it by id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubPngUploadRequest"
      responses:
        "200":
          description: Presigned upload URL and upload row id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubPngUploadResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: App Storage not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /hub/uploads/{token}/{filename}:
    get:
      operationId: getHubCalcPng
      tags: [hub]
      summary: Unauthenticated public URL that streams a calculator PNG from App Storage
      description: >
        Identified by a high-entropy token (64-char hex). The trailing
        filename segment is cosmetic — it controls how Printavo names the
        attached file. No auth required; token is the only access control.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Not found (unknown token or object not yet uploaded)
  /hub/calculator/push:
    post:
      operationId: pushHubCalculator
      tags: [hub]
      summary: Push pricing calculator results to a Printavo invoice or quote
      description: >
        Re-reads the live invoice or quote productionNote, replaces only the
        deterministic [Hub Price Calculator ...] block for the same
        quote/range marker, then calls the matching order update and
        productionFileCreate exactly once. Persists state before/between
        mutations. Idempotent for
        identical confirmed requests — will not duplicate the note block or
        attachment. When an explicit lineItem snapshot is
        included, also creates one line-item group exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubCalculatorPushRequest"
      responses:
        "200":
          description: Push outcome (may be partial success)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubCalculatorPushResult"
        "400":
          description: Invalid request or upload row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Push already in progress for this upload row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Printavo not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /hub/calculator/categories:
    get:
      operationId: listHubCalculatorCategories
      tags: [hub]
      summary: List Printavo line-item categories available to the calculator
      responses:
        "200":
          description: Categories mirrored from Printavo, most-used first
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/HubCalculatorCategory"
