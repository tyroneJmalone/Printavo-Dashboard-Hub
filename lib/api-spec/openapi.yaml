    post:
      operationId: applyStatusSuggestion
      tags: [purchasing]
      summary: Apply a suggestion — changes the order's status in Printavo via the shared gateway
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSuggestion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already applied/dismissed, order already in the target status, or the order's status changed since evaluation (snapshot refreshed — re-confirm)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Printavo rejected the status change (suggestion marked failed, retryable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyStatusSuggestionError"
        "503":
          description: Printavo credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
