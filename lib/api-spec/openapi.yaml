openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Staff authentication / session
  - name: sync
    description: Printavo sync engine
  - name: printavo
    description: Printavo gateway
  - name: purchasing
    description: Purchasing / vendor orders module
  - name: printQueue
    description: Production print queue (workorders / packing slips / box labels)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current staff session
      description: Returns the signed-in staff member's email and role
      responses:
        "200":
          description: Signed-in staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          description: No session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in but not on the staff allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthForbidden"
  /auth/staff:
    get:
      operationId: listStaff
      tags: [auth]
      summary: List the staff allowlist (admin only)
      responses:
        "200":
          description: All staff rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffListResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addStaff
      tags: [auth]
      summary: Add a staff member to the allowlist (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStaffRequest"
      responses:
        "201":
          description: Created staff row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          description: Invalid email or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already on the staff list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/staff/{id}:
    patch:
      operationId: updateStaffRole
      tags: [auth]
      summary: Change a staff member's role (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRoleRequest"
      responses:
        "200":
          description: Updated staff row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          description: Staff member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Blocked — would leave the app without an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeStaff
      tags: [auth]
      summary: Remove a staff member from the allowlist (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "404":
          description: Staff member not found
        "409":
          description: Blocked — you can't remove yourself or the last admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/admin-pin:
    get:
      operationId: getAdminPinStatus
      tags: [auth]
      summary: Whether the admin PIN is configured and where it lives (admin only)
      responses:
        "200":
          description: PIN status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPinStatus"
    put:
      operationId: setAdminPin
      tags: [auth]
      summary: Change the admin PIN (admin only; current PIN required once one exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAdminPinRequest"
      responses:
        "200":
          description: PIN updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPinStatus"
        "400":
          description: Invalid new PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Wrong current PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Locked out after too many wrong PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Sync engine status
      description: Local record counts, seed/poll run info, watermarks, scheduler and gateway stats
      responses:
        "200":
          description: Current sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
  /sync/events:
    get:
      operationId: listChangeEvents
      tags: [sync]
      summary: Recent change events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Change events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeEventItem"
  /sync/seed:
    post:
      operationId: startSeed
      tags: [sync]
      summary: Start or resume the initial 12-month seed
      responses:
        "200":
          description: Seed start result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedStartResult"
  /sync/poll:
    post:
      operationId: triggerPoll
      tags: [sync]
      summary: Run an incremental poll now
      description: >-
        Starts a manual incremental poll. Guard cases (another sync running,
        seed incomplete, credentials missing, immediate failure) return within
        ~1.5s with ran:false and an explanatory message. Otherwise responds
        immediately with ran:true / "Poll started" and stats:null while the
        poll continues in the background — watch GET /sync/status until
        lastIncremental leaves the "running" state.
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
  /printavo/probe:
    get:
      operationId: probePrintavo
      tags: [printavo]
      summary: One-request connectivity probe against Printavo
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
  /purchasing/needs-ordering:
    get:
      operationId: getNeedsOrdering
      tags: [purchasing]
      summary: Orders with line items needing ordering
      description: Scans synced pv_line_items for product_status='need_ordering', grouped by order
      responses:
        "200":
          description: Needs-ordering scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsOrderingResult"
  /purchasing/vendor-lookup:
    post:
      operationId: vendorLookup
      tags: [purchasing]
      summary: Live vendor catalog lookup by style
      description: Fetches all colors/sizes with cost and inventory for a style from SanMar or S&S Activewear. Cached in-memory ~15 minutes per vendor+style.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorLookupRequest"
      responses:
        "200":
          description: Unified vendor catalog result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorLookupResult"
        "503":
          description: Vendor credentials missing or vendor API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/vendor-inventory:
    post:
      operationId: vendorInventory
      tags: [purchasing]
      summary: Per-warehouse availability for a resolved style+color
      description: Live warehouse quantities for the given sizes of an exact vendor catalog color. SanMar quantities are capped at 3000 per warehouse (capped=true means "3000+"). Cached in-memory ~5 minutes per vendor+style+color.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInventoryRequest"
      responses:
        "200":
          description: Per-size warehouse availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInventoryResult"
        "503":
          description: Vendor credentials missing or vendor API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files:
    get:
      operationId: listPoFiles
      tags: [purchasing]
      summary: List saved purchase orders (newest first)
      responses:
        "200":
          description: PO file list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFileList"
    post:
      operationId: createPoFile
      tags: [purchasing]
      summary: Save a purchase order built from the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePoFileRequest"
      responses:
        "201":
          description: Created PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
  /purchasing/po-files/{id}:
    get:
      operationId: getPoFile
      tags: [purchasing]
      summary: Fetch one purchase order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePoFile
      tags: [purchasing]
      summary: Delete a purchase order (blocked while locked)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePoFile
      tags: [purchasing]
      summary: Update a PO — metadata (number, notes) and/or replace the line items (totals recomputed server-side). Blocked while locked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePoFileRequest"
      responses:
        "200":
          description: Updated PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked or the PO number is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/line-items:
    post:
      operationId: appendPoLineItems
      tags: [purchasing]
      summary: Append line items to an existing PO (totals recomputed server-side). Blocked while locked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendPoLineItemsRequest"
      responses:
        "200":
          description: Updated PO file with the appended lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/push:
    post:
      operationId: pushPoFile
      tags: [purchasing]
      summary: Start a background push of this PO to Printavo (marks linked lines Ordered, attaches the PO document to each invoice). Progress is reported via PoFile.pushState.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Push started (or resumed after a failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStartResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already running, or no Printavo-linked lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Printavo credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/submit-to-vendor:
    post:
      operationId: submitPoToVendor
      tags: [purchasing]
      summary: Mark a PO as submitted to the vendor — locks edits (only the admin unlock can remove it) — optionally recording the vendor's order/confirmation number.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPoToVendorRequest"
      responses:
        "200":
          description: Updated PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already submitted to the vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/vendor-submit:
    post:
      operationId: vendorSubmit
      tags: [purchasing]
      summary: Preview or electronically submit a PO to its vendor (SanMar submitPO / S&S orders). Defaults to a no-network dry-run preview; test and live modes require the admin PIN and are coerced to dry_run unless electronic submission is enabled on the server.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSubmitRequest"
      responses:
        "200":
          description: Submission result — preview, ineligible, submitted, failed, unknown, already_active, in_progress, or not_configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSubmitResult"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin PIN incorrect, or the admin PIN isn't set up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many wrong PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/vendor-orders:
    get:
      operationId: listVendorOrders
      tags: [purchasing]
      summary: List electronic vendor order submissions (newest first), including vendor status and tracking numbers from the latest refresh.
      parameters:
        - name: poFileId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Vendor order rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorOrdersListResponse"
  /purchasing/vendor-orders/refresh-active:
    post:
      operationId: refreshActiveVendorOrders
      tags: [purchasing]
      summary: Refresh vendor status/tracking for every active live order (submitted or unknown, not archived). Read-only against the vendors; runs sequentially. Unknown orders the vendor confirms are auto-reconciled to submitted.
      responses:
        "200":
          description: Per-order refresh results plus counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorOrderRefreshAllResult"
  /purchasing/vendor-orders/{id}/refresh:
    post:
      operationId: refreshVendorOrder
      tags: [purchasing]
      summary: Refresh vendor status/tracking for one live order (read-only vendor lookup). An unknown order the vendor confirms is auto-reconciled to submitted; an unknown order the vendor has no record of stays unknown (never auto-failed).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refresh result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorOrderRefreshResult"
        "404":
          description: Vendor order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/vendor-orders/{id}/mark-failed:
    post:
      operationId: markVendorOrderFailed
      tags: [purchasing]
      summary: Admin-only — manually resolve an UNKNOWN order as failed, releasing the anti-double-order lock so the PO can be submitted again. Requires the admin PIN. Only allowed for unknown orders; never automated because a wrong call can cause a duplicate order.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkVendorOrderFailedRequest"
      responses:
        "200":
          description: The order was marked failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorOrderRefreshResult"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin PIN incorrect, or the admin PIN isn't set up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vendor order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order is not in unknown status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many wrong PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/settings/ship-to:
    get:
      operationId: getVendorShipTo
      tags: [purchasing]
      summary: Get the ship-to address vendor orders (SanMar/S&S) are shipped to. Returns null when not configured yet.
      responses:
        "200":
          description: The configured ship-to address, or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorShipToResponse"
    put:
      operationId: setVendorShipTo
      tags: [purchasing]
      summary: Save the ship-to address used for vendor orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorShipTo"
      responses:
        "200":
          description: The saved ship-to address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorShipTo"
        "400":
          description: Invalid ship-to payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/unlock:
    post:
      operationId: unlockPoFile
      tags: [purchasing]
      summary: Manually unlock a PO that was pushed to Printavo. Vendor-submitted POs need the admin unlock instead.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Unlocked PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is not locked, or was submitted to the vendor (admin unlock required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/admin-unlock:
    post:
      operationId: adminUnlockPoFile
      tags: [purchasing]
      summary: Admin-only — un-mark a PO as submitted to the vendor (clears the vendor lock and the vendor order number). Requires the admin PIN.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUnlockPoFileRequest"
      responses:
        "200":
          description: Unlocked PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "403":
          description: Admin PIN missing, incorrect, or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is not vendor-locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/html:
    get:
      operationId: getPoFileHtml
      tags: [purchasing]
      summary: Printable PO document rendered on demand from the stored line items
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Printable PO document
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Not found
          content:
            text/html:
              schema: { type: string }
  /purchasing/printavo-statuses:
    get:
      operationId: listPrintavoStatuses
      tags: [purchasing]
      summary: All Printavo order statuses (from the local sync) for the rule target picker
      responses:
        "200":
          description: Statuses sorted by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintavoStatusesResponse"
  /purchasing/status-rules:
    get:
      operationId: listStatusRules
      tags: [purchasing]
      summary: Status rules ordered by priority (first match wins)
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusRulesResponse"
    post:
      operationId: createStatusRule
      tags: [purchasing]
      summary: Create a status rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusRuleRequest"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusRule"
        "400":
          description: Invalid rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/status-rules/{id}:
    patch:
      operationId: updateStatusRule
      tags: [purchasing]
      summary: Update a status rule (any subset of fields, including priority and enabled)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRuleRequest"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusRule"
        "400":
          description: Invalid rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStatusRule
