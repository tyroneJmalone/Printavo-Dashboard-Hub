openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Staff authentication / session
  - name: sync
    description: Printavo sync engine
  - name: printavo
    description: Printavo gateway
  - name: purchasing
    description: Purchasing / vendor orders module
  - name: printQueue
    description: Production print queue (workorders / packing slips / box labels)
  - name: sorter
    description: Packing slip / shipping label PDF sorter
  - name: shipping
    description: Shipping rate estimator (ShipStation + EasyPost)
  - name: clients
    description: Client 360 — customer directory, niche categories, reporting
  - name: insights
    description: Ask AI — natural-language questions over local Printavo data + saved presets
  - name: emailActivity
    description: Email activity tracker — Gmail metadata sync + team stats
  - name: statusActivity
    description: Status activity — daily status-arrival counts + per-status occupancy/dwell (bottlenecks)
  - name: chipply
    description: Chipply web stores — email/export import, Printavo invoice linking, revenue kept separate
  - name: hub
    description: Hub Price Calculator — AI interpretation, PNG upload, invoice search, and Printavo push
  - name: reorderPortal
    description: Public customer-facing reorder portal (no staff auth)
  - name: reorderRequests
    description: Staff reorder request inbox
  - name: knowledge
    description: Staff knowledge base and grounded customer-message playground
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current staff session
      description: Returns the signed-in staff member's email and role
      responses:
        "200":
          description: Signed-in staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          description: No session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in but not on the staff allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthForbidden"
  /auth/module-access:
    get:
      operationId: getModuleAccess
      tags: [auth]
      summary: List module readiness switches (admin only)
      responses:
        "200":
          description: All modules with their enabled state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleAccessResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateModuleAccess
      tags: [auth]
      summary: Replace the set of enabled modules (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModuleAccessRequest"
      responses:
        "200":
          description: Updated module list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleAccessResponse"
        "400":
          description: Invalid payload or unknown module key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/staff:
    get:
      operationId: listStaff
      tags: [auth]
      summary: List the staff allowlist (admin only)
      responses:
        "200":
          description: All staff rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffListResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addStaff
      tags: [auth]
      summary: Add a staff member to the allowlist (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStaffRequest"
      responses:
        "201":
          description: Created staff row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          description: Invalid email or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already on the staff list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/staff/{id}:
    patch:
      operationId: updateStaffRole
      tags: [auth]
      summary: Change a staff member's role (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRoleRequest"
      responses:
        "200":
          description: Updated staff row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          description: Staff member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Blocked — would leave the app without an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeStaff
      tags: [auth]
      summary: Remove a staff member from the allowlist (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "404":
          description: Staff member not found
        "409":
          description: Blocked — you can't remove yourself or the last admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/admin-pin:
    get:
      operationId: getAdminPinStatus
      tags: [auth]
      summary: Whether the admin PIN is configured and where it lives (admin only)
      responses:
        "200":
          description: PIN status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPinStatus"
    put:
      operationId: setAdminPin
      tags: [auth]
      summary: Change the admin PIN (admin only; current PIN required once one exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAdminPinRequest"
      responses:
        "200":
          description: PIN updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPinStatus"
        "400":
          description: Invalid new PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Wrong current PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Locked out after too many wrong PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Sync engine status
      description: Local record counts, seed/poll run info, watermarks, scheduler and gateway stats
      responses:
        "200":
          description: Current sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
  /sync/events:
    get:
      operationId: listChangeEvents
      tags: [sync]
      summary: Recent change events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Change events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeEventItem"
  /sync/seed:
    post:
      operationId: startSeed
      tags: [sync]
      summary: Start or resume the initial 12-month seed
      responses:
        "200":
          description: Seed start result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedStartResult"
  /sync/poll:
    post:
      operationId: triggerPoll
      tags: [sync]
      summary: Run an incremental poll now
      description: >-
        Starts a manual incremental poll. Guard cases (another sync running,
        seed incomplete, credentials missing, immediate failure) return within
        ~1.5s with ran:false and an explanatory message. Otherwise responds
        immediately with ran:true / "Poll started" and stats:null while the
        poll continues in the background — watch GET /sync/status until
        lastIncremental leaves the "running" state.
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
  /backup/status:
    get:
      operationId: getBackupStatus
      tags: [backup]
      summary: Backup coverage status
      description: >-
        Per-table row counts and freshness, order-extras archive coverage,
        thread message backlog, file mirror progress, watermarks and last
        incremental run — everything the Backups dashboard shows.
      responses:
        "200":
          description: Current backup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
  /backup/export:
    get:
      operationId: downloadBackupExport
      tags: [backup]
      summary: Download full backup bundle (admin only)
      description: >-
        Streams a ZIP containing manifest.json plus one NDJSON file per
        backup table (raw database rows including original Printavo API
        payloads). Mirrored binary files stay in object storage;
        pv_files.ndjson is their manifest. Admin only. Returns 409 if an
        export is already in progress.
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "409":
          description: An export is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customers:
    get:
      operationId: listDirectoryCustomers
      tags: [clients]
      summary: Customer directory with lifetime stats and category
      description: search matches customer name, email, or keywords in their order nicknames (e.g. "soccer").
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: uncategorized
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: sort
          in: query
          schema: { type: string, enum: [spend, name] }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Directory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryCustomersResponse"
  /customers/categories:
    get:
      operationId: listCustomerCategories
      tags: [clients]
      summary: All niche categories with assignment counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCategoriesResponse"
    post:
      operationId: createCustomerCategory
      tags: [clients]
      summary: Create a category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCategory"
        "409":
          description: Duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customers/categories/{id}:
    patch:
      operationId: updateCustomerCategory
      tags: [clients]
      summary: Rename or (de)activate a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCategory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customers/assign:
    post:
      operationId: assignCustomerCategory
      tags: [clients]
      summary: Assign (or clear) a category for one or many customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCustomersBody"
      responses:
        "200":
          description: Assignment result
          content:
            application/json:
              schema:
                type: object
                required: [assigned]
                properties:
                  assigned:
                    type: integer
  /customers/report:
    get:
      operationId: getNicheReport
      tags: [clients]
      summary: Revenue / orders / customers grouped by niche category
      description: Invoices only (quotes excluded), matching existing report semantics. Time range filters on invoice date.
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [all, ytd, last12, custom] }
        - name: start
          in: query
          schema: { type: string }
        - name: end
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Niche report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicheReportResponse"
  /branding/colors:
    get:
      operationId: listBrandingColors
      tags: [clients]
      summary: List the shared Hub-owned branding color catalog
      responses:
        "200":
          description: Bounded color catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingColorList"
    post:
      operationId: createBrandingColor
      tags: [clients]
      summary: Add a color to the shared catalog (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBrandingColorRequest" }
      responses:
        "201":
          description: Created catalog color
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingColor" }
        "409":
          description: A color with this name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /branding/colors/{colorId}:
    patch:
      operationId: updateBrandingColor
      tags: [clients]
      summary: Correct or deactivate a shared catalog color (admin only)
      parameters:
        - name: colorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBrandingColorRequest" }
      responses:
        "200":
          description: Updated catalog color
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingColor" }
        "404":
          description: Color not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customers/{id}/branding:
    get:
      operationId: getCustomerBranding
      tags: [clients]
      summary: Get customer branding notes, fonts, and assigned catalog colors
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
      responses:
        "200":
          description: Customer branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBranding" }
        "404":
          description: Customer not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: updateCustomerBranding
      tags: [clients]
      summary: Replace customer branding selections (admin only)
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerBrandingUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: boolean }
  /customers/{id}/artwork:
    get:
      operationId: getCustomerArtwork
      tags: [clients]
      summary: Get linked Dropbox folder and staple artwork bookmarks
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
      responses:
        "200":
          description: Artwork state; linked=false is a normal supported response and still includes retired logo bookmarks (read-only brand-standard history; file access stays blocked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerArtwork" }
  /customers/{id}/artwork/folder:
    put:
      operationId: linkCustomerArtworkFolder
      tags: [clients]
      summary: Link one Dropbox root folder to a customer; relinking to a different folder retires (never deletes) existing logo bookmarks (admin only)
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DropboxFolderLinkRequest" }
      responses:
        "200":
          description: Linked folder
          content:
            application/json:
              schema:
                type: object
                required: [linked, folder]
                properties:
                  linked: { type: boolean }
                  folder: { $ref: "#/components/schemas/DropboxEntry" }
        "503":
          description: Dropbox connection unavailable or lacks required read scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: unlinkCustomerArtworkFolder
      tags: [clients]
      summary: Remove the customer folder link; its logo bookmarks are retired, never deleted (admin only)
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
      responses:
        "204": { description: Unlinked (any active logo bookmarks were retired with a history event) }
  /customers/{id}/artwork/folder-picker:
    get:
      operationId: pickCustomerArtworkFolder
      tags: [clients]
      summary: Browse Dropbox folders before linking a customer root (admin only)
      description: Returns folders only. An omitted or empty path means the Dropbox account root. When q is provided, searches folders recursively across the Dropbox account.
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
        - name: q
          in: query
          required: false
          description: Search all Dropbox folders recursively by name
          schema: { type: string, maxLength: 200 }
        - name: path
          in: query
          required: false
          schema: { type: string, maxLength: 1000 }
        - name: cursor
          in: query
          required: false
          description: Opaque, short-lived cursor returned by this picker for the same customer, path, and staff user
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bounded folder-picker page
          content:
            application/json:
              schema:
                type: object
                required: [folders, truncated, cursor]
                properties:
                  folders:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/DropboxEntry" }
                  truncated: { type: boolean }
                  cursor: { type: [string, "null"], format: uuid }
        "503":
          description: Dropbox connection unavailable or lacks metadata scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customers/{id}/artwork/browse:
    get:
      operationId: browseCustomerArtwork
      tags: [clients]
      summary: Browse one bounded page under the linked customer root
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
        - name: path
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
            description: Opaque, short-lived cursor bound to this customer root and requested path
      responses:
        "200":
          description: Folder entries or a graceful unlinked state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DropboxEntryList" }
  /customers/{id}/artwork/search:
    get:
      operationId: searchCustomerArtwork
      tags: [clients]
      summary: Search within the linked customer root
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: Search results or a graceful unlinked state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DropboxEntryList" }
  /customers/{id}/artwork/metadata:
    get:
      operationId: getCustomerArtworkMetadata
      tags: [clients]
      summary: Read metadata after server-side linked-root authorization
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
        - $ref: "#/components/parameters/DropboxLocatorParam"
      responses:
        "200":
          description: Dropbox metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DropboxEntry" }
  /customers/{id}/artwork/temporary-link:
    get:
      operationId: getCustomerArtworkTemporaryLink
      tags: [clients]
      summary: Get a temporary original-file download link
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
        - $ref: "#/components/parameters/DropboxLocatorParam"
        - name: redirect
          in: query
          required: false
          description: Redirect directly to the temporary Dropbox URL instead of returning JSON
          schema: { type: boolean, default: false }
        - name: inline
          in: query
          required: false
          description: Proxy a browser-safe PDF or raster image for an in-app preview
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Temporary provider link
          content:
            application/json:
              schema:
                type: object
                required: [link, expires]
                properties:
                  link: { type: string, format: uri }
                  expires: { type: string, enum: [temporary] }
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to the temporary Dropbox file URL
          headers:
            Location:
              schema: { type: string, format: uri }
  /customers/{id}/artwork/bookmarks:
    post:
      operationId: createCustomerArtworkBookmark
      tags: [clients]
      summary: Bookmark a staple artwork item (admin only)
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtworkBookmarkRequest" }
      responses:
        "201":
          description: Created bookmark
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtworkBookmark" }
        "409":
          description: Item is already bookmarked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customers/{id}/artwork/bookmarks/{bookmarkId}:
    patch:
      operationId: updateCustomerArtworkBookmark
      tags: [clients]
      summary: Update bookmark label, notes, preferred, or retired state (admin only)
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
        - $ref: "#/components/parameters/ArtworkBookmarkIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtworkBookmarkUpdate" }
      responses:
        "200":
          description: Updated bookmark
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtworkBookmark" }
    delete:
      operationId: deleteCustomerArtworkBookmark
      tags: [clients]
      summary: Retire an artwork bookmark (admin only) — brand-standard history is retained, never deleted
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
        - $ref: "#/components/parameters/ArtworkBookmarkIdParam"
      responses:
        "204": { description: Retired (idempotent; the bookmark row and its history are kept) }
  /customers/{id}:
    get:
      operationId: getCustomerProfile
      tags: [clients]
      summary: Customer profile — contact info, category, spend stats, recent orders
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          description: Filter order history to an exact status name
          schema: { type: string }
        - name: q
          in: query
          description: Keyword filter on order nickname or order number
          schema: { type: string }
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfileResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pipeline:
    get:
      operationId: getPipeline
      tags: [pipeline]
      summary: Sales pipeline — quotes by stage plus recently won/done invoices
      parameters:
        - name: owner
          in: query
          required: false
          description: Filter to a single rep by owner email
          schema: { type: string }
        - name: stage
          in: query
          required: false
          description: >
            Stage to list rows for. "active" (default) combines the working
            stages (quote, quote_sent, follow_up_1, follow_up_2, nurturing,
            art, other).
          schema:
            type: string
            enum:
              [
                active,
                quote,
                quote_sent,
                follow_up_1,
                follow_up_2,
                nurturing,
                art,
                won,
                done,
                dead,
                contract_dead_archive,
                archive,
                other,
              ]
        - name: wonDays
          in: query
          required: false
          description: Window (days) for the Won and Done stages
          schema: { type: integer, minimum: 7, maximum: 365 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Pipeline report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineReport"
  /printavo/probe:
    get:
      operationId: probePrintavo
      tags: [printavo]
      summary: One-request connectivity probe against Printavo
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
  /printavo/orders/{orderId}/history:
    get:
      operationId: getPrintavoOrderHistory
      tags: [printavo]
      summary: Read complete-observation line-item history for an order
      description: >
        Reads the local Printavo mirror only. History is based on complete,
        successful detail observations; the first observation is a baseline
        and is not emitted as a change. No upstream Printavo write is made.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          required: false
          description: Maximum snapshots and events returned per page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: beforeSnapshotId
          in: query
          required: false
          description: Return older snapshot rows than this snapshot id
          schema: { type: integer, minimum: 1 }
        - name: beforeEventId
          in: query
          required: false
          description: Return older change events than this event id
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Order line-item history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintavoOrderHistory"
        "404":
          description: Order is not present in the local mirror
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/needs-ordering:
    get:
      operationId: getNeedsOrdering
      tags: [purchasing]
      summary: Orders with line items needing ordering
      description: Scans synced pv_line_items for product_status='need_ordering', grouped by order
      responses:
        "200":
          description: Needs-ordering scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsOrderingResult"
  /purchasing/line-item-product-status:
    post:
      operationId: bulkSetLineItemProductStatus
      tags: [purchasing]
      summary: Set product status on selected purchasing queue line items
      description: Updates only explicitly selected line items that still need ordering, after a fresh Printavo read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLineItemProductStatusRequest"
      responses:
        "200":
          description: Per-line outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLineItemProductStatusResponse"
        "400":
          description: Invalid or duplicate line-item selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/vendor-lookup:
    post:
      operationId: vendorLookup
      tags: [purchasing]
      summary: Live vendor catalog lookup by style
      description: Fetches all colors/sizes with cost and inventory for a style from SanMar or S&S Activewear. Cached in-memory ~15 minutes per vendor+style.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorLookupRequest"
      responses:
        "200":
          description: Unified vendor catalog result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorLookupResult"
        "503":
          description: Vendor credentials missing or vendor API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/vendor-inventory:
    post:
      operationId: vendorInventory
      tags: [purchasing]
      summary: Per-warehouse availability for a resolved style+color
      description: Live warehouse quantities for the given sizes of an exact vendor catalog color. SanMar quantities are capped at 3000 per warehouse (capped=true means "3000+"). Cached in-memory ~5 minutes per vendor+style+color.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInventoryRequest"
      responses:
        "200":
          description: Per-size warehouse availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInventoryResult"
        "503":
          description: Vendor credentials missing or vendor API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/product-search:
    post:
      operationId: productSearch
      tags: [purchasing]
      summary: Cross-vendor product search (Product Finder)
      description: Searches SanMar and S&S Activewear at once for a style query; retries known cross-vendor style aliases (e.g. G500 vs 5000) when a vendor misses. A single vendor failure degrades to a not-found entry with vendorErrors populated, rather than failing the whole search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchRequest"
      responses:
        "200":
          description: Per-vendor search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSearchResult"
        "503":
          description: Vendor credentials missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/finder-order:
    get:
      operationId: getFinderOrder
      tags: [purchasing]
      summary: Synced order + line items by visual ID (Product Finder invoice mode)
      parameters:
        - name: visualId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Order with line items from the local mirror
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinderOrder"
        "404":
          description: No synced order with this visual ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/catalog/search:
    get:
      operationId: catalogSearch
      tags: [purchasing]
      summary: Descriptive search over the local vendor catalog
      description: Deterministic tokenized search over the nightly-imported SanMar + S&S catalog. Color words expand to color families ("forest green polos" matches Forest, Forest Green, Dark Green...). No live inventory here — click through to the live stock view for that.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: vendor
          in: query
          schema: { type: string, enum: [sanmar, ss] }
        - name: brand
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: colorFamily
          in: query
          schema: { type: string }
        - name: priceMin
          in: query
          schema: { type: number }
        - name: priceMax
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Ranked catalog hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchResult"
  /purchasing/catalog/filters:
    get:
      operationId: getCatalogFilters
      tags: [purchasing]
      summary: Distinct filter values (brands, categories, color families)
      responses:
        "200":
          description: Filter values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFilters"
  /purchasing/catalog/health:
    get:
      operationId: getCatalogHealth
      tags: [purchasing]
      summary: Catalog counts + recent refresh runs (health panel)
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealth"
  /purchasing/catalog/refresh:
    post:
      operationId: triggerCatalogRefresh
      tags: [purchasing]
      summary: Kick off a catalog refresh in the background
      description: Returns immediately; progress is visible via the health endpoint. No-op (started=false) when a refresh is already running.
      responses:
        "200":
          description: Refresh trigger result
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                required: [started]
  /purchasing/catalog/tag-override:
    post:
      operationId: setCatalogTagOverride
      tags: [purchasing]
      summary: Staff tag correction for a catalog product
      description: Keyed by vendor+style so it survives nightly re-imports. Effective tags = (imported ∪ add) − remove.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogTagOverrideRequest"
      responses:
        "200":
          description: Updated effective tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  effectiveTags:
                    type: array
                    items: { type: string }
                required: [effectiveTags]
  /purchasing/catalog/color-family:
    post:
      operationId: setCatalogColorFamily
      tags: [purchasing]
      summary: Staff correction of a color name's families
      description: Global across vendors and products; marked source=staff so nightly AI passes never overwrite it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogColorFamilyRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /purchasing/catalog/pantones:
    get:
      operationId: listCatalogPantones
      tags: [purchasing]
      summary: List imported vendor/style/color identities and verified garment Pantones
      description: Staff-only bounded search over exact imported catalog identities. Null means the vendor has not provided a verified garment Pantone.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: vendor
          in: query
          schema: { type: string, enum: [sanmar, ss] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Imported color identity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPantoneList"
        "400":
          description: Invalid query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: setCatalogPantone
      tags: [purchasing]
      summary: Attach, correct, or remove a verified garment Pantone
      description: Upserts evidence by exact vendor/style/color without changing web-swatch measurement fields. Code and source must either both be null or both be provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogPantoneUpdate"
      responses:
        "200":
          description: Saved imported color identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogPantoneIdentity" }
        "400":
          description: Invalid code/source pairing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Exact imported identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List curation collections (newest first)
      parameters:
        - name: customerId
          in: query
          description: Filter to collections linked to this Printavo customer id
          schema: { type: string }
      responses:
        "200":
          description: Collection list
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      $ref: "#/components/schemas/CollectionSummary"
                required: [collections]
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a collection (optionally with initial items)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
  /collections/{id}:
    get:
      operationId: getCollection
      tags: [collections]
      summary: Fetch one collection with enriched items
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCollection
      tags: [collections]
      summary: Rename, edit notes, or reassign the linked customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection and its items
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
        "404":
          description: Not found
  /collections/palette-preview:
    post:
      operationId: previewCollectionPalette
      tags: [collections]
      summary: Preview exact catalog garment colors ranked against a customer's branding palette
      description: Staff-only, read-only. Styles resolve only by exact case-insensitive style name; an unprefixed cross-vendor match is returned as ambiguous.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaletteCollectionPreviewRequest" }
      responses:
        "200":
          description: Resolved suggestions and unresolved/ambiguous inputs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaletteCollectionPreviewResponse" }
        "400":
          description: Invalid request or customer has no configured active branding colors
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Customer not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /collections/from-suggestion:
    post:
      operationId: createCollectionFromSuggestion
      tags: [collections]
      summary: Atomically save reviewed palette suggestion selections as a collection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCollectionFromSuggestionRequest" }
      responses:
        "201":
          description: Saved collection
          content: { application/json: { schema: { $ref: "#/components/schemas/CollectionDetail" } } }
        "400":
          description: A reviewed style or color is no longer active or available
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Customer not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /collections/{id}/items:
    post:
      operationId: addCollectionItems
      tags: [collections]
      summary: Add one or more styles to a collection
      description: Styles already in the collection are merged (colors unioned, note kept unless a new one is given) rather than duplicated.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCollectionItemsRequest"
      responses:
        "200":
          description: Collection detail after the add
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "404":
          description: Not found
  /collections/{id}/items/{itemId}:
    patch:
      operationId: updateCollectionItem
      tags: [collections]
      summary: Update an item's chosen colors or note
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionItemRequest"
      responses:
        "200":
          description: Collection detail after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "404":
          description: Not found
    delete:
      operationId: removeCollectionItem
      tags: [collections]
      summary: Remove an item from a collection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collection detail after the removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "404":
          description: Not found
  /purchasing/po-files:
    get:
      operationId: listPoFiles
      tags: [purchasing]
      summary: List saved purchase orders (newest first)
      responses:
        "200":
          description: PO file list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFileList"
    post:
      operationId: createPoFile
      tags: [purchasing]
      summary: Save a purchase order built from the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePoFileRequest"
      responses:
        "201":
          description: Created PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
  /purchasing/po-files/{id}:
    get:
      operationId: getPoFile
      tags: [purchasing]
      summary: Fetch one purchase order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePoFile
      tags: [purchasing]
      summary: Delete a purchase order (blocked while locked)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePoFile
      tags: [purchasing]
      summary: Update a PO — metadata (number, notes) and/or replace the line items (totals recomputed server-side). Blocked while locked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePoFileRequest"
      responses:
        "200":
          description: Updated PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked or the PO number is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/line-items:
    post:
      operationId: appendPoLineItems
      tags: [purchasing]
      summary: Append line items to an existing PO (totals recomputed server-side). Blocked while locked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendPoLineItemsRequest"
      responses:
        "200":
          description: Updated PO file with the appended lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/push:
    post:
      operationId: pushPoFile
      tags: [purchasing]
      summary: Start a background push of this PO to Printavo (marks linked lines Ordered, attaches the PO document to each invoice). Progress is reported via PoFile.pushState.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Push started (or resumed after a failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStartResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already running, or no Printavo-linked lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Printavo credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/submit-to-vendor:
    post:
      operationId: submitPoToVendor
      tags: [purchasing]
      summary: Mark a PO as submitted to the vendor — locks edits (only the admin unlock can remove it) — optionally recording the vendor's order/confirmation number.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPoToVendorRequest"
      responses:
        "200":
          description: Updated PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already submitted to the vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/vendor-submit:
    post:
      operationId: vendorSubmit
      tags: [purchasing]
      summary: Preview or electronically submit a PO to its vendor (SanMar submitPO / S&S orders). Defaults to a no-network dry-run preview; test and live modes require the admin PIN and are coerced to dry_run unless electronic submission is enabled on the server.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSubmitRequest"
      responses:
        "200":
          description: Submission result — preview, ineligible, submitted, failed, unknown, already_active, in_progress, or not_configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSubmitResult"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
