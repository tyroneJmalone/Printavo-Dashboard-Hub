        dryRun: { type: boolean }
        categoryMappings:
          type: array
          items:
            $ref: "#/components/schemas/AutoPrintCategoryMapping"
      required:
        [
          enabled,
          scheduleMode,
          scheduleHours,
          dailyTimes,
          sourceStatusIds,
          errorStatusId,
          errorStatusName,
          printerId,
          printerName,
          copies,
          dryRun,
          categoryMappings,
        ]
