  /reports/payments:
    get:
      operationId: getPaymentsReport
      tags: [reports]
      summary: Cash-basis payment buckets by transaction date
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string }
        - name: end
          in: query
          required: false
          schema: { type: string }
        - name: types
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
