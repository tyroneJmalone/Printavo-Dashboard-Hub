      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PqAutomationSetting"
      responses:
        "200":
          description: Saved setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqAutomationSetting"
  /print-queue/rules/evaluate-and-run:
    post:
      operationId: evaluatePqRulesAndRun
      tags: [printQueue]
      summary: Evaluate Print Queue rules for just-printed orders; auto-mode matches start a job server-side, ask-mode matches are returned for confirmation
      description: >
        Enforces the master automation switch server-side — when it is off
        nothing is evaluated and nothing runs. Auto matches are started as a
        background status job in the SAME call so a closed browser tab cannot
        strand them; ask matches are returned for an ephemeral confirm panel
        (confirmed items go to POST /print-queue/status-jobs with a per-order
        stale guard).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PqEvaluateAndRunRequest"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqEvaluateAndRunResponse"
        "400":
          description: Missing / too many order ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /print-queue/status-jobs:
    get:
      operationId: listPqStatusJobs
      tags: [printQueue]
      summary: Recent Print Queue status-change jobs, newest first (interrupted jobs surface as retryable)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqStatusJobsResponse"
    post:
      operationId: startPqStatusJob
      tags: [printQueue]
      summary: Start a background bulk status-change job (one at a time; per-order stale guard; writes via the throttled gateway)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPqStatusJobRequest"
      responses:
        "202":
          description: Job started — poll GET /print-queue/status-jobs/{id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqStatusJob"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another status job is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Printavo credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /print-queue/status-jobs/{id}:
    get:
      operationId: getPqStatusJob
      tags: [printQueue]
      summary: Poll a status-change job's per-order progress
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PqStatusJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /print-queue/autoprint/config:
    get:
      operationId: getAutoPrintConfig
      tags: [printQueue]
      summary: Auto-print configuration (defaults enabled=false, dryRun=true)
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPrintConfig"
    put:
      operationId: updateAutoPrintConfig
      tags: [printQueue]
      summary: Replace the auto-print configuration (server normalizes invalid fields to safe defaults)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoPrintConfig"
      responses:
        "200":
          description: Saved config (normalized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPrintConfig"
  /print-queue/autoprint/printers:
    get:
      operationId: listAutoPrintPrinters
      tags: [printQueue]
      summary: PrintNode printers on the account (configured=false when the API key is missing)
      responses:
        "200":
          description: Printers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPrintPrintersResponse"
        "502":
          description: PrintNode API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /print-queue/autoprint/categories:
    get:
      operationId: listImprintCategories
      tags: [printQueue]
      summary: Distinct typeOfWork categories seen in synced imprints (for the mapping editor)
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPrintCategoriesResponse"
  /print-queue/autoprint/run:
    post:
      operationId: startAutoPrintRun
      tags: [printQueue]
      summary: Start an auto-print run now (one at a time; dryRun in the body overrides the config flag)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAutoPrintRunRequest"
      responses:
        "202":
          description: Run started — poll GET /print-queue/autoprint/runs/{id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPrintRun"
        "400":
          description: Invalid request (no source statuses, no printer for a real run, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /print-queue/autoprint/runs:
    get:
      operationId: listAutoPrintRuns
      tags: [printQueue]
      summary: Recent auto-print runs, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPrintRunsResponse"
  /print-queue/autoprint/runs/{id}:
    get:
      operationId: getAutoPrintRun
      tags: [printQueue]
      summary: Poll one auto-print run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPrintRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /print-queue/autoprint/jobs:
    get:
      operationId: listAutoPrintJobs
      tags: [printQueue]
      summary: Per-order print history (the dedup source), newest first
      parameters:
        - name: runId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPrintJobsResponse"
components:
  parameters:
    OrderTypeParam:
      name: orderType
      in: query
      required: false
      schema: { type: string, enum: [invoice, quote, all] }
    StatusesParam:
      name: statuses
      in: query
      required: false
      description: "||-separated status names"
      schema: { type: string }
    BrandsParam:
      name: brands
      in: query
      required: false
      schema: { type: string }
    CategoriesParam:
      name: categories
      in: query
      required: false
      schema: { type: string }
    StyleNumbersParam:
      name: styleNumbers
      in: query
      required: false
      schema: { type: string }
    ColorsParam:
      name: colors
      in: query
      required: false
      schema: { type: string }
    CreatedStartParam:
      name: createdStart
      in: query
      required: false
      description: "YYYY-MM-DD, record-created basis (ET)"
      schema: { type: string }
    CreatedEndParam:
      name: createdEnd
      in: query
      required: false
      schema: { type: string }
    InvoiceStartParam:
      name: invoiceStart
      in: query
      required: false
      description: "YYYY-MM-DD, invoice-date basis"
      schema: { type: string }
    InvoiceEndParam:
      name: invoiceEnd
      in: query
      required: false
      schema: { type: string }
    ProductionDueStartParam:
      name: productionDueStart
      in: query
      required: false
      description: "YYYY-MM-DD, production-due basis (ET)"
      schema: { type: string }
    ProductionDueEndParam:
      name: productionDueEnd
      in: query
      required: false
      schema: { type: string }
    DueStartParam:
      name: dueStart
      in: query
      required: false
      description: "YYYY-MM-DD, customer-due basis (ET)"
      schema: { type: string }
    DueEndParam:
      name: dueEnd
      in: query
      required: false
      schema: { type: string }
    MinQtyParam:
      name: minQty
      in: query
      required: false
      schema: { type: number }
    MaxQtyParam:
      name: maxQty
      in: query
      required: false
      schema: { type: number }
    MinTotalParam:
      name: minTotal
      in: query
      required: false
      schema: { type: number }
    MaxTotalParam:
      name: maxTotal
      in: query
      required: false
      schema: { type: number }
    SearchParam:
      name: search
      in: query
      required: false
      schema: { type: string }
    ExcludeParam:
      name: exclude
      in: query
      required: false
      description: "||-separated filter keys to invert (statuses, brands, categories, styleNumbers, colors)"
      schema: { type: string }
  schemas:
    AuthMe:
      type: object
      properties:
        email: { type: string }
        role: { type: string, enum: [admin, staff] }
      required: [email, role]
    AuthForbidden:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
      required: [error]
    StaffMember:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, staff] }
        addedByEmail: { type: string, nullable: true }
        linked:
          type: boolean
          description: Whether this person has signed in at least once in this environment
        createdAt: { type: string }
      required: [id, email, role, addedByEmail, linked, createdAt]
    StaffListResponse:
      type: object
      properties:
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
      required: [staff]
    AddStaffRequest:
      type: object
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        role: { type: string, enum: [admin, staff] }
      required: [email, role]
    UpdateStaffRoleRequest:
      type: object
      properties:
        role: { type: string, enum: [admin, staff] }
      required: [role]
    AdminPinStatus:
      type: object
      properties:
        configured: { type: boolean }
        source:
          type: string
          enum: [database, secret]
          nullable: true
          description: Where the active PIN lives — app database or the ADMIN_PIN secret fallback
      required: [configured, source]
    SetAdminPinRequest:
      type: object
      properties:
        currentPin: { type: string, maxLength: 64 }
        newPin: { type: string, minLength: 4, maxLength: 12 }
      required: [newPin]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SyncCounts:
      type: object
      properties:
        orders: { type: integer }
        quotes: { type: integer }
        invoices: { type: integer }
        customers: { type: integer }
        contacts: { type: integer }
        statuses: { type: integer }
        changeEvents: { type: integer }
      required: [orders, quotes, invoices, customers, contacts, statuses, changeEvents]
    SyncRunInfo:
      type: object
      properties:
        id: { type: integer }
        runType: { type: string }
        status: { type: string }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        stats:
          type: ["object", "null"]
          additionalProperties: true
        error: { type: ["string", "null"] }
      required: [id, runType, status, startedAt, finishedAt, stats, error]
    WatermarkInfo:
      type: object
      properties:
        entity: { type: string }
        watermark: { type: string }
      required: [entity, watermark]
    SchedulerState:
      type: object
      properties:
        running: { type: boolean }
        pollIntervalMinutes: { type: integer }
        lastPollAt: { type: ["string", "null"] }
        lastResult: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
      required: [running, pollIntervalMinutes, lastPollAt, lastResult, lastError]
    GatewayStats:
      type: object
      properties:
        requestCount: { type: integer }
        retryCount: { type: integer }
        errorCount: { type: integer }
        lastRequestAt: { type: ["string", "null"] }
        last429At: { type: ["string", "null"] }
      required: [requestCount, retryCount, errorCount, lastRequestAt, last429At]
    SyncStatus:
      type: object
      properties:
        configured: { type: boolean }
        seedActive: { type: boolean }
        counts:
          $ref: "#/components/schemas/SyncCounts"
        seed:
          anyOf:
            - $ref: "#/components/schemas/SyncRunInfo"
            - type: "null"
        lastIncremental:
          anyOf:
            - $ref: "#/components/schemas/SyncRunInfo"
            - type: "null"
        watermarks:
          type: array
          items:
            $ref: "#/components/schemas/WatermarkInfo"
        scheduler:
          $ref: "#/components/schemas/SchedulerState"
        gateway:
          anyOf:
            - $ref: "#/components/schemas/GatewayStats"
            - type: "null"
      required: [configured, seedActive, counts, seed, lastIncremental, watermarks, scheduler, gateway]
    ChangeEventItem:
      type: object
      properties:
        id: { type: integer }
        entityType: { type: string }
        entityId: { type: string }
        visualId: { type: ["integer", "null"] }
        eventType: { type: string }
        field: { type: ["string", "null"] }
        oldValue: {}
        newValue: {}
        occurredAt: { type: string }
        syncRunId: { type: ["integer", "null"] }
      required: [id, entityType, entityId, visualId, eventType, field, occurredAt, syncRunId]
    SeedStartResult:
      type: object
      properties:
        started: { type: boolean }
        syncRunId: { type: ["integer", "null"] }
        message: { type: string }
      required: [started, syncRunId, message]
    PollResult:
      type: object
      properties:
        ran: { type: boolean }
        message: { type: string }
        stats:
          type: ["object", "null"]
          additionalProperties: true
      required: [ran, message, stats]
    ProbeResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
      required: [ok, message]
    ReportStats:
      type: object
      properties:
        orders: { type: integer }
        revenue: { type: number }
        quantity: { type: integer }
        avgOrderValue: { type: number }
      required: [orders, revenue, quantity, avgOrderValue]
    ReportFiltersEcho:
      type: object
      additionalProperties: true
    ReportOrderSummary:
      type: object
      properties:
        id: { type: string }
        visualId: { type: ["integer", "null"] }
        orderType: { type: string }
        statusName: { type: ["string", "null"] }
        nickname: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        total: { type: number }
        qty: { type: integer }
        createdAt: { type: ["string", "null"] }
        invoiceAt: { type: ["string", "null"] }
        productionDueAt: { type: ["string", "null"] }
        dueAt: { type: ["string", "null"] }
      required: [id, visualId, orderType, statusName, nickname, customerName, total, qty, createdAt, invoiceAt, productionDueAt, dueAt]
    OrdersReport:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReportFiltersEcho"
        stats:
          $ref: "#/components/schemas/ReportStats"
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        orders:
          type: array
          items:
            $ref: "#/components/schemas/ReportOrderSummary"
      required: [filters, stats, total, limit, offset, orders]
    ReportBreakdownRow:
      type: object
      properties:
        label: { type: string }
        orders: { type: integer }
        quantity: { type: integer }
        revenue: { type: number }
        pctOfRevenue: { type: number }
      required: [label, orders, quantity, revenue, pctOfRevenue]
    BreakdownReport:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReportFiltersEcho"
        stats:
          $ref: "#/components/schemas/ReportStats"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ReportBreakdownRow"
      required: [filters, stats, rows]
    PaymentBucket:
      type: object
      properties:
        bucket: { type: string }
        count: { type: integer }
        amount: { type: number }
      required: [bucket, count, amount]
    PaymentsReport:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        types:
          type: array
          items: { type: string }
        granularity: { type: string, enum: [daily, weekly] }
        total: { type: number }
        count: { type: integer }
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/PaymentBucket"
      required: [start, end, types, granularity, total, count, buckets]
    PaymentTypeStat:
      type: object
      properties:
        typename: { type: string }
        count: { type: integer }
        amount: { type: number }
      required: [typename, count, amount]
    PaymentsStats:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        byType:
          type: array
          items:
            $ref: "#/components/schemas/PaymentTypeStat"
        net: { type: number }
      required: [start, end, byType, net]
    SizeCount:
      type: object
      properties:
        size: { type: string }
        count: { type: integer }
      required: [size, count]
    NeedsOrderingLineItem:
      type: object
      properties:
        id: { type: string }
        itemNumber: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        categoryName: { type: ["string", "null"] }
        items: { type: integer }
        price: { type: ["number", "null"] }
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/SizeCount"
      required: [id, itemNumber, color, description, brand, categoryName, items, price, sizes]
    NeedsOrderingOrder:
      type: object
      properties:
        orderId: { type: string }
        visualId: { type: integer }
        orderType: { type: string }
        nickname: { type: ["string", "null"] }
        customerCompany: { type: ["string", "null"] }
        contactName: { type: ["string", "null"] }
        statusName: { type: ["string", "null"] }
        invoiceAt: { type: ["string", "null"] }
        productionDueAt: { type: ["string", "null"] }
        customerDueAt: { type: ["string", "null"] }
        detailSyncedAt: { type: ["string", "null"] }
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/NeedsOrderingLineItem"
      required: [orderId, visualId, orderType, nickname, customerCompany, contactName, statusName, invoiceAt, productionDueAt, customerDueAt, detailSyncedAt, lineItems]
    NeedsOrderingResult:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/NeedsOrderingOrder"
        totalOrders: { type: integer }
        totalLineItems: { type: integer }
        totalPieces: { type: integer }
      required: [orders, totalOrders, totalLineItems, totalPieces]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    VendorLookupRequest:
      type: object
      properties:
        vendor: { type: string, enum: [sanmar, ss] }
        style: { type: string, minLength: 1 }
        brandHint:
          type: ["string", "null"]
          description: Printavo brand (e.g. "Gildan") — disambiguates when multiple brands share a style number at the vendor.
        descriptionHint:
          type: ["string", "null"]
          description: Printavo line-item description — secondary disambiguation signal.
      required: [vendor, style]
    VendorWarehouseQty:
      type: object
      properties:
        code: { type: string }
        qty: { type: integer }
      required: [code, qty]
    VendorSizeOffer:
      type: object
      properties:
        size: { type: string }
        sku: { type: ["string", "null"] }
        inventoryKey: { type: ["string", "null"] }
        sizeIndex: { type: ["integer", "null"] }
        cost: { type: ["number", "null"] }
        msrp: { type: ["number", "null"] }
        salePrice: { type: ["number", "null"] }
        saleEndsAt: { type: ["string", "null"] }
        inventoryTotal: { type: ["integer", "null"] }
        warehouses:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/VendorWarehouseQty"
      required: [size, sku, inventoryKey, sizeIndex, cost, msrp, salePrice, saleEndsAt, inventoryTotal, warehouses]
    VendorColorOffer:
      type: object
      properties:
        colorName: { type: string }
        swatchImage:
          type: ["string", "null"]
          description: Small color swatch image (absolute URL) — null when the vendor has none.
        productImage:
          type: ["string", "null"]
          description: Product photo in this color (absolute URL) — null when the vendor has none.
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/VendorSizeOffer"
      required: [colorName, swatchImage, productImage, sizes]
    VendorLookupResult:
      type: object
      properties:
        found: { type: boolean }
        matchType: { type: string, enum: [exact, closest, none] }
        vendor: { type: string, enum: [sanmar, ss] }
        styleQueried: { type: string }
        styleId:
          type: ["string", "null"]
          description: Vendor-internal id of the matched product (S&S styleID). Pass it to vendor-inventory so stock comes from the SAME product that priced the line. Null for SanMar.
        styleName: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        styleImage:
          type: ["string", "null"]
          description: Style-level hero image (absolute URL) — fallback before a color is chosen.
        colors:
          type: array
          items:
            $ref: "#/components/schemas/VendorColorOffer"
        cached: { type: boolean }
        fetchedAt: { type: string }
      required: [found, matchType, vendor, styleQueried, styleId, styleName, brand, title, styleImage, colors, cached, fetchedAt]
    VendorInventoryRequest:
      type: object
      properties:
        vendor: { type: string, enum: [sanmar, ss] }
        style: { type: string, minLength: 1 }
        styleId:
          type: ["string", "null"]
          description: Vendor-internal id from the lookup result (S&S styleID). When set, inventory is read from exactly that product instead of re-searching by style number.
        catalogColor: { type: string, minLength: 1 }
        sizes:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1 }
      required: [vendor, style, catalogColor, sizes]
    VendorWarehouseAvailability:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        qty: { type: integer }
        capped:
          type: boolean
          description: True when the vendor caps the reported quantity (SanMar reports at most 3000 per warehouse — display "3000+").
      required: [code, name, qty, capped]
    VendorInventorySize:
      type: object
      properties:
        size: { type: string }
        found: { type: boolean }
        warehouses:
          type: array
          items:
            $ref: "#/components/schemas/VendorWarehouseAvailability"
      required: [size, found, warehouses]
    VendorInventoryResult:
      type: object
      properties:
        vendor: { type: string, enum: [sanmar, ss] }
        style: { type: string }
        catalogColor: { type: string }
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/VendorInventorySize"
        cached: { type: boolean }
        fetchedAt: { type: string }
      required: [vendor, style, catalogColor, sizes, cached, fetchedAt]
    PoFileSizeEntry:
