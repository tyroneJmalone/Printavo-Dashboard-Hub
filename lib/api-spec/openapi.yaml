          items:
            $ref: "#/components/schemas/HubPricingDecorationFill"
        warnings:
          type: array
          items: { type: string }
          description: Non-fatal issues (ambiguous product, missing column, etc.)
    HubPngUploadRequest:
      type: object
      required: [invoiceId, visualId, rangeKey, priceRows, quoteNumber]
      properties:
        invoiceId:
          type: string
          description: Internal Printavo invoice or quote id (validated against local mirror)
        visualId:
          type: integer
          description: Visible invoice or quote number (validated against local mirror)
        rangeKey:
          type: string
          description: >
            Validated range key — one of: all, 12-48, 36-72, 60-96, 84-120,
            108-144, 144-288. Submitted qtys must fall within the inclusive range
            (all accepts any positive qty).
          enum: [all, "12-48", "36-72", "60-96", "84-120", "108-144", "144-288"]
        priceRows:
          type: array
          description: >
            Price rows for this snapshot. Unique ascending qtys, finite unit
            prices >=0. Used for dedupe hash and stored in the upload row.
          items:
            $ref: "#/components/schemas/HubCalculatorPriceRow"
        quoteNumber:
          type: string
          pattern: '^\d{1,20}$'
          maxLength: 20
        lineItem:
          oneOf:
            - $ref: "#/components/schemas/HubCalculatorLineItemRequest"
            - type: "null"
        note:
          type: string
          nullable: true
          maxLength: 2000
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Declared file size (unused for server-side GCS verification but informational)
    HubPngUploadResponse:
      type: object
      required: [uploadId, uploadUrl, objectPath, publicUrl, dedupe]
      properties:
        uploadId:
          type: string
          description: Hub upload row UUID — pass to the push endpoint
        uploadUrl:
          type: string
          description: >
            Presigned PUT URL (valid ~15 minutes); upload PNG bytes directly to
            GCS with Content-Type image/png. Null when dedupe matched an existing
            row that is already uploaded/pushed (no re-upload needed).
          nullable: true
        objectPath:
          type: string
          description: GCS object path for the PNG
        publicUrl:
          type: string
          description: Stable unauthenticated public URL (available once PNG is uploaded)
        dedupe:
          type: boolean
          description: True when an existing identical snapshot row was reused
    HubCalculatorPriceRow:
      type: object
      required: [qty, unitPrice]
      properties:
        qty: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
    HubCalculatorCategory:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    HubCalculatorLineItemRequest:
      type: object
      required: [categoryId, itemNumber, color, brand, description]
      properties:
        categoryId: { type: string, minLength: 1, maxLength: 40 }
        itemNumber: { type: string, minLength: 1, maxLength: 100 }
        color: { type: string, minLength: 1, maxLength: 100 }
        brand: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 500 }
    HubCalculatorPushRequest:
      type: object
      required: [uploadId, invoiceId, visualId, rangeKey, priceRows, quoteNumber]
      properties:
        uploadId:
          type: string
          description: Upload row UUID from requestHubPngUploadUrl
        invoiceId:
          type: string
          description: Internal Printavo invoice or quote id (must match upload row and live order)
        visualId:
          type: integer
          description: Visible invoice or quote number (must match upload row and live order)
        rangeKey:
          type: string
          description: Range key (must match upload row)
          enum: [all, "12-48", "36-72", "60-96", "84-120", "108-144", "144-288"]
        priceRows:
          type: array
          description: Price rows — must match the snapshot stored in the upload row
          items:
            $ref: "#/components/schemas/HubCalculatorPriceRow"
        quoteNumber:
          type: string
          pattern: '^\d{1,20}$'
          maxLength: 20
        lineItem:
          oneOf:
            - $ref: "#/components/schemas/HubCalculatorLineItemRequest"
            - type: "null"
    HubCalculatorPushResult:
      type: object
      required: [noteOutcome, fileOutcome, lineItemOutcome, uploadId, status]
      properties:
        uploadId: { type: string }
        status:
          type: string
          enum: [note_ok, file_ok, note_failed, file_failed, file_locked, partial]
          description: >
            file_locked means productionFileCreate was attempted but the outcome
            is ambiguous — manual verification required, no retry allowed.
        noteOutcome:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
            locked: { type: boolean, description: "True when note mutation is locked pending verification" }
            error: { type: string, nullable: true }
        fileOutcome:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
            locked: { type: boolean, description: "True when file mutation is locked pending verification" }
            productionFileId: { type: string, nullable: true }
            error: { type: string, nullable: true }
        lineItemOutcome:
          type: object
          required: [requested, ok]
          properties:
            requested: { type: boolean }
            ok: { type: boolean }
            locked: { type: boolean }
            lineItemGroupId: { type: string, nullable: true }
            lineItemId: { type: string, nullable: true }
            error: { type: string, nullable: true }
