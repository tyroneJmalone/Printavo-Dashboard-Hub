        dueBusinessDays: { type: ["integer", "null"] }
        targetStatusId: { type: ["string", "null"] }
        targetStatusName: { type: ["string", "null"] }
        mode: { type: string, enum: [off, ask, auto] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
