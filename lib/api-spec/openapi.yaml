  /reports/payments:
    get:
      operationId: getPaymentsReport
      tags: [reports]
      summary: Cash-basis payment buckets by transaction date
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string }
        - name: end
          in: query
          required: false
          schema: { type: string }
        - name: types
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Payments report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsReport"
  /reports/payments/stats:
    get:
      operationId: getPaymentsStats
      tags: [reports]
      summary: Payment totals by type
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string }
        - name: end
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Payments stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsStats"
  /reports/filter-options:
    get:
      operationId: getReportFilterOptions
      tags: [reports]
      summary: Distinct values for report filter dropdowns
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFilterOptions"
components:
  parameters:
    OrderTypeParam:
      name: orderType
      in: query
      required: false
      schema: { type: string, enum: [invoice, quote, all] }
    StatusesParam:
      name: statuses
      in: query
      required: false
      description: "||-separated status names"
      schema: { type: string }
    BrandsParam:
      name: brands
      in: query
      required: false
      schema: { type: string }
    CategoriesParam:
      name: categories
      in: query
      required: false
      schema: { type: string }
    StyleNumbersParam:
      name: styleNumbers
      in: query
      required: false
      schema: { type: string }
    ColorsParam:
      name: colors
      in: query
      required: false
      schema: { type: string }
    CreatedStartParam:
      name: createdStart
      in: query
      required: false
      description: "YYYY-MM-DD, record-created basis (ET)"
      schema: { type: string }
    CreatedEndParam:
      name: createdEnd
      in: query
      required: false
      schema: { type: string }
    InvoiceStartParam:
      name: invoiceStart
      in: query
      required: false
      description: "YYYY-MM-DD, invoice-date basis"
      schema: { type: string }
    InvoiceEndParam:
      name: invoiceEnd
      in: query
      required: false
      schema: { type: string }
    ProductionDueStartParam:
      name: productionDueStart
      in: query
      required: false
      description: "YYYY-MM-DD, production-due basis (ET)"
      schema: { type: string }
    ProductionDueEndParam:
      name: productionDueEnd
      in: query
      required: false
      schema: { type: string }
    DueStartParam:
      name: dueStart
      in: query
      required: false
      description: "YYYY-MM-DD, customer-due basis (ET)"
      schema: { type: string }
    DueEndParam:
      name: dueEnd
      in: query
      required: false
      schema: { type: string }
    MinQtyParam:
      name: minQty
      in: query
      required: false
      schema: { type: number }
    MaxQtyParam:
      name: maxQty
      in: query
      required: false
      schema: { type: number }
    MinTotalParam:
      name: minTotal
      in: query
      required: false
      schema: { type: number }
    MaxTotalParam:
      name: maxTotal
      in: query
      required: false
      schema: { type: number }
    SearchParam:
      name: search
      in: query
      required: false
      schema: { type: string }
    ExcludeParam:
      name: exclude
      in: query
      required: false
      description: "||-separated filter keys to invert (statuses, brands, categories, styleNumbers, colors)"
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SyncCounts:
      type: object
      properties:
        orders: { type: integer }
        quotes: { type: integer }
        invoices: { type: integer }
        customers: { type: integer }
        contacts: { type: integer }
        statuses: { type: integer }
        changeEvents: { type: integer }
      required: [orders, quotes, invoices, customers, contacts, statuses, changeEvents]
    SyncRunInfo:
      type: object
      properties:
        id: { type: integer }
        runType: { type: string }
        status: { type: string }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        stats:
          type: ["object", "null"]
          additionalProperties: true
        error: { type: ["string", "null"] }
      required: [id, runType, status, startedAt, finishedAt, stats, error]
    WatermarkInfo:
      type: object
      properties:
        entity: { type: string }
        watermark: { type: string }
      required: [entity, watermark]
    SchedulerState:
      type: object
      properties:
        running: { type: boolean }
        pollIntervalMinutes: { type: integer }
        lastPollAt: { type: ["string", "null"] }
        lastResult: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
      required: [running, pollIntervalMinutes, lastPollAt, lastResult, lastError]
    GatewayStats:
      type: object
      properties:
        requestCount: { type: integer }
        retryCount: { type: integer }
        errorCount: { type: integer }
        lastRequestAt: { type: ["string", "null"] }
        last429At: { type: ["string", "null"] }
      required: [requestCount, retryCount, errorCount, lastRequestAt, last429At]
    SyncStatus:
      type: object
      properties:
        configured: { type: boolean }
        seedActive: { type: boolean }
        counts:
          $ref: "#/components/schemas/SyncCounts"
        seed:
          anyOf:
            - $ref: "#/components/schemas/SyncRunInfo"
            - type: "null"
        lastIncremental:
          anyOf:
            - $ref: "#/components/schemas/SyncRunInfo"
            - type: "null"
        watermarks:
          type: array
          items:
            $ref: "#/components/schemas/WatermarkInfo"
        scheduler:
          $ref: "#/components/schemas/SchedulerState"
        gateway:
          anyOf:
            - $ref: "#/components/schemas/GatewayStats"
            - type: "null"
      required: [configured, seedActive, counts, seed, lastIncremental, watermarks, scheduler, gateway]
    ChangeEventItem:
      type: object
      properties:
        id: { type: integer }
        entityType: { type: string }
        entityId: { type: string }
        visualId: { type: ["integer", "null"] }
        eventType: { type: string }
        field: { type: ["string", "null"] }
        oldValue: {}
        newValue: {}
        occurredAt: { type: string }
        syncRunId: { type: ["integer", "null"] }
      required: [id, entityType, entityId, visualId, eventType, field, occurredAt, syncRunId]
    SeedStartResult:
      type: object
      properties:
        started: { type: boolean }
        syncRunId: { type: ["integer", "null"] }
        message: { type: string }
      required: [started, syncRunId, message]
    PollResult:
      type: object
      properties:
        ran: { type: boolean }
        message: { type: string }
        stats:
          type: ["object", "null"]
          additionalProperties: true
      required: [ran, message, stats]
    ProbeResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
      required: [ok, message]
    ReportStats:
      type: object
      properties:
        orders: { type: integer }
        revenue: { type: number }
        quantity: { type: integer }
        avgOrderValue: { type: number }
      required: [orders, revenue, quantity, avgOrderValue]
    ReportFiltersEcho:
      type: object
      additionalProperties: true
    ReportOrderSummary:
      type: object
      properties:
        id: { type: string }
        visualId: { type: ["integer", "null"] }
        orderType: { type: string }
        statusName: { type: ["string", "null"] }
        nickname: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        total: { type: number }
        qty: { type: integer }
        createdAt: { type: ["string", "null"] }
        invoiceAt: { type: ["string", "null"] }
        productionDueAt: { type: ["string", "null"] }
        dueAt: { type: ["string", "null"] }
      required: [id, visualId, orderType, statusName, nickname, customerName, total, qty, createdAt, invoiceAt, productionDueAt, dueAt]
    OrdersReport:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReportFiltersEcho"
        stats:
          $ref: "#/components/schemas/ReportStats"
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        orders:
          type: array
          items:
            $ref: "#/components/schemas/ReportOrderSummary"
      required: [filters, stats, total, limit, offset, orders]
    ReportBreakdownRow:
      type: object
      properties:
        label: { type: string }
        orders: { type: integer }
        quantity: { type: integer }
        revenue: { type: number }
        pctOfRevenue: { type: number }
      required: [label, orders, quantity, revenue, pctOfRevenue]
    BreakdownReport:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReportFiltersEcho"
        stats:
          $ref: "#/components/schemas/ReportStats"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ReportBreakdownRow"
      required: [filters, stats, rows]
    PaymentBucket:
      type: object
      properties:
        bucket: { type: string }
        count: { type: integer }
        amount: { type: number }
      required: [bucket, count, amount]
    PaymentsReport:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        types:
          type: array
          items: { type: string }
        granularity: { type: string, enum: [daily, weekly] }
        total: { type: number }
        count: { type: integer }
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/PaymentBucket"
      required: [start, end, types, granularity, total, count, buckets]
    PaymentTypeStat:
      type: object
      properties:
        typename: { type: string }
        count: { type: integer }
        amount: { type: number }
      required: [typename, count, amount]
    PaymentsStats:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        byType:
          type: array
          items:
            $ref: "#/components/schemas/PaymentTypeStat"
        net: { type: number }
