          type: array
          items:
            type: object
            required: [input, candidates]
            properties:
              input: { type: string }
              candidates:
                type: array
                items:
                  type: object
                  required: [vendor, styleName, brand, title]
                  properties:
                    vendor: { type: string, enum: [sanmar, ss] }
                    styleName: { type: string }
                    brand: { type: ["string", "null"] }
                    title: { type: ["string", "null"] }
    ReviewedPaletteItemRequest:
      type: object
