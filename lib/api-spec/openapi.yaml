      summary: Payment totals by type
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string }
        - name: end
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Payments stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsStats"
  /reports/filter-options:
    get:
      operationId: getReportFilterOptions
      tags: [reports]
      summary: Distinct values for report filter dropdowns
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFilterOptions"
components:
  parameters:
    OrderTypeParam:
      name: orderType
      in: query
      required: false
      schema: { type: string, enum: [invoice, quote, all] }
    StatusesParam:
      name: statuses
      in: query
      required: false
      description: "||-separated status names"
      schema: { type: string }
    BrandsParam:
      name: brands
      in: query
      required: false
      schema: { type: string }
    CategoriesParam:
      name: categories
      in: query
      required: false
      schema: { type: string }
    StyleNumbersParam:
      name: styleNumbers
      in: query
      required: false
      schema: { type: string }
    ColorsParam:
      name: colors
      in: query
      required: false
      schema: { type: string }
    CreatedStartParam:
      name: createdStart
      in: query
      required: false
      description: "YYYY-MM-DD, record-created basis (ET)"
      schema: { type: string }
    CreatedEndParam:
      name: createdEnd
      in: query
      required: false
      schema: { type: string }
    InvoiceStartParam:
      name: invoiceStart
      in: query
      required: false
      description: "YYYY-MM-DD, invoice-date basis"
      schema: { type: string }
    InvoiceEndParam:
      name: invoiceEnd
      in: query
      required: false
      schema: { type: string }
    ProductionDueStartParam:
      name: productionDueStart
      in: query
      required: false
      description: "YYYY-MM-DD, production-due basis (ET)"
      schema: { type: string }
    ProductionDueEndParam:
      name: productionDueEnd
      in: query
      required: false
      schema: { type: string }
    DueStartParam:
      name: dueStart
      in: query
      required: false
      description: "YYYY-MM-DD, customer-due basis (ET)"
      schema: { type: string }
    DueEndParam:
      name: dueEnd
      in: query
      required: false
      schema: { type: string }
    MinQtyParam:
      name: minQty
      in: query
      required: false
      schema: { type: number }
    MaxQtyParam:
      name: maxQty
      in: query
      required: false
      schema: { type: number }
    MinTotalParam:
      name: minTotal
      in: query
      required: false
      schema: { type: number }
    MaxTotalParam:
      name: maxTotal
      in: query
      required: false
      schema: { type: number }
    SearchParam:
      name: search
      in: query
      required: false
      schema: { type: string }
    ExcludeParam:
      name: exclude
      in: query
      required: false
      description: "||-separated filter keys to invert (statuses, brands, categories, styleNumbers, colors)"
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SyncCounts:
      type: object
      properties:
        orders: { type: integer }
        quotes: { type: integer }
        invoices: { type: integer }
        customers: { type: integer }
        contacts: { type: integer }
        statuses: { type: integer }
        changeEvents: { type: integer }
      required: [orders, quotes, invoices, customers, contacts, statuses, changeEvents]
    SyncRunInfo:
      type: object
      properties:
        id: { type: integer }
        runType: { type: string }
        status: { type: string }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        stats:
          type: ["object", "null"]
          additionalProperties: true
        error: { type: ["string", "null"] }
      required: [id, runType, status, startedAt, finishedAt, stats, error]
    WatermarkInfo:
      type: object
      properties:
        entity: { type: string }
        watermark: { type: string }
      required: [entity, watermark]
    SchedulerState:
      type: object
      properties:
        running: { type: boolean }
        pollIntervalMinutes: { type: integer }
        lastPollAt: { type: ["string", "null"] }
        lastResult: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
      required: [running, pollIntervalMinutes, lastPollAt, lastResult, lastError]
    GatewayStats:
      type: object
      properties:
        requestCount: { type: integer }
        retryCount: { type: integer }
        errorCount: { type: integer }
        lastRequestAt: { type: ["string", "null"] }
        last429At: { type: ["string", "null"] }
      required: [requestCount, retryCount, errorCount, lastRequestAt, last429At]
    SyncStatus:
      type: object
      properties:
        configured: { type: boolean }
        seedActive: { type: boolean }
        counts:
          $ref: "#/components/schemas/SyncCounts"
        seed:
          anyOf:
            - $ref: "#/components/schemas/SyncRunInfo"
            - type: "null"
        lastIncremental:
          anyOf:
            - $ref: "#/components/schemas/SyncRunInfo"
            - type: "null"
        watermarks:
          type: array
          items:
            $ref: "#/components/schemas/WatermarkInfo"
        scheduler:
          $ref: "#/components/schemas/SchedulerState"
        gateway:
          anyOf:
            - $ref: "#/components/schemas/GatewayStats"
            - type: "null"
      required: [configured, seedActive, counts, seed, lastIncremental, watermarks, scheduler, gateway]
    ChangeEventItem:
      type: object
      properties:
        id: { type: integer }
        entityType: { type: string }
        entityId: { type: string }
        visualId: { type: ["integer", "null"] }
        eventType: { type: string }
        field: { type: ["string", "null"] }
        oldValue: {}
        newValue: {}
        occurredAt: { type: string }
        syncRunId: { type: ["integer", "null"] }
      required: [id, entityType, entityId, visualId, eventType, field, occurredAt, syncRunId]
    SeedStartResult:
      type: object
      properties:
        started: { type: boolean }
        syncRunId: { type: ["integer", "null"] }
        message: { type: string }
      required: [started, syncRunId, message]
    PollResult:
      type: object
      properties:
        ran: { type: boolean }
        message: { type: string }
        stats:
          type: ["object", "null"]
          additionalProperties: true
      required: [ran, message, stats]
    ProbeResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
      required: [ok, message]
    ReportStats:
      type: object
      properties:
        orders: { type: integer }
        revenue: { type: number }
        quantity: { type: integer }
        avgOrderValue: { type: number }
      required: [orders, revenue, quantity, avgOrderValue]
    ReportFiltersEcho:
      type: object
      additionalProperties: true
    ReportOrderSummary:
      type: object
      properties:
        id: { type: string }
        visualId: { type: ["integer", "null"] }
        orderType: { type: string }
        statusName: { type: ["string", "null"] }
        nickname: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        total: { type: number }
        qty: { type: integer }
        createdAt: { type: ["string", "null"] }
        invoiceAt: { type: ["string", "null"] }
        productionDueAt: { type: ["string", "null"] }
        dueAt: { type: ["string", "null"] }
      required: [id, visualId, orderType, statusName, nickname, customerName, total, qty, createdAt, invoiceAt, productionDueAt, dueAt]
    OrdersReport:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReportFiltersEcho"
        stats:
          $ref: "#/components/schemas/ReportStats"
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        orders:
          type: array
          items:
            $ref: "#/components/schemas/ReportOrderSummary"
      required: [filters, stats, total, limit, offset, orders]
    ReportBreakdownRow:
      type: object
      properties:
        label: { type: string }
        orders: { type: integer }
        quantity: { type: integer }
        revenue: { type: number }
        pctOfRevenue: { type: number }
      required: [label, orders, quantity, revenue, pctOfRevenue]
    BreakdownReport:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReportFiltersEcho"
        stats:
          $ref: "#/components/schemas/ReportStats"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ReportBreakdownRow"
      required: [filters, stats, rows]
    PaymentBucket:
      type: object
      properties:
        bucket: { type: string }
        count: { type: integer }
        amount: { type: number }
      required: [bucket, count, amount]
    PaymentsReport:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        types:
          type: array
          items: { type: string }
        granularity: { type: string, enum: [daily, weekly] }
        total: { type: number }
        count: { type: integer }
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/PaymentBucket"
      required: [start, end, types, granularity, total, count, buckets]
    PaymentTypeStat:
      type: object
      properties:
        typename: { type: string }
        count: { type: integer }
        amount: { type: number }
      required: [typename, count, amount]
    PaymentsStats:
      type: object
      properties:
        start: { type: string }
        end: { type: string }
        byType:
          type: array
          items:
            $ref: "#/components/schemas/PaymentTypeStat"
        net: { type: number }
      required: [start, end, byType, net]
    SizeCount:
      type: object
      properties:
        size: { type: string }
        count: { type: integer }
      required: [size, count]
    NeedsOrderingLineItem:
      type: object
      properties:
        id: { type: string }
        itemNumber: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        categoryName: { type: ["string", "null"] }
        items: { type: integer }
        price: { type: ["number", "null"] }
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/SizeCount"
      required: [id, itemNumber, color, description, brand, categoryName, items, price, sizes]
    NeedsOrderingOrder:
      type: object
      properties:
        orderId: { type: string }
        visualId: { type: integer }
        orderType: { type: string }
        nickname: { type: ["string", "null"] }
        customerCompany: { type: ["string", "null"] }
        contactName: { type: ["string", "null"] }
        statusName: { type: ["string", "null"] }
        invoiceAt: { type: ["string", "null"] }
        productionDueAt: { type: ["string", "null"] }
        customerDueAt: { type: ["string", "null"] }
        detailSyncedAt: { type: ["string", "null"] }
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/NeedsOrderingLineItem"
      required: [orderId, visualId, orderType, nickname, customerCompany, contactName, statusName, invoiceAt, productionDueAt, customerDueAt, detailSyncedAt, lineItems]
    NeedsOrderingResult:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/NeedsOrderingOrder"
        totalOrders: { type: integer }
        totalLineItems: { type: integer }
        totalPieces: { type: integer }
      required: [orders, totalOrders, totalLineItems, totalPieces]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    VendorLookupRequest:
      type: object
      properties:
        vendor: { type: string, enum: [sanmar, ss] }
        style: { type: string, minLength: 1 }
        brandHint:
          type: ["string", "null"]
          description: Printavo brand (e.g. "Gildan") — disambiguates when multiple brands share a style number at the vendor.
        descriptionHint:
          type: ["string", "null"]
          description: Printavo line-item description — secondary disambiguation signal.
      required: [vendor, style]
    VendorWarehouseQty:
      type: object
      properties:
        code: { type: string }
        qty: { type: integer }
      required: [code, qty]
    VendorSizeOffer:
      type: object
      properties:
        size: { type: string }
        sku: { type: ["string", "null"] }
        inventoryKey: { type: ["string", "null"] }
        sizeIndex: { type: ["integer", "null"] }
        cost: { type: ["number", "null"] }
        msrp: { type: ["number", "null"] }
        salePrice: { type: ["number", "null"] }
        saleEndsAt: { type: ["string", "null"] }
        inventoryTotal: { type: ["integer", "null"] }
        warehouses:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/VendorWarehouseQty"
      required: [size, sku, inventoryKey, sizeIndex, cost, msrp, salePrice, saleEndsAt, inventoryTotal, warehouses]
    VendorColorOffer:
      type: object
      properties:
        colorName: { type: string }
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/VendorSizeOffer"
      required: [colorName, sizes]
    VendorLookupResult:
      type: object
      properties:
        found: { type: boolean }
        matchType: { type: string, enum: [exact, closest, none] }
        vendor: { type: string, enum: [sanmar, ss] }
        styleQueried: { type: string }
        styleId:
          type: ["string", "null"]
          description: Vendor-internal id of the matched product (S&S styleID). Pass it to vendor-inventory so stock comes from the SAME product that priced the line. Null for SanMar.
        styleName: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        colors:
          type: array
          items:
            $ref: "#/components/schemas/VendorColorOffer"
        cached: { type: boolean }
        fetchedAt: { type: string }
      required: [found, matchType, vendor, styleQueried, styleId, styleName, brand, title, colors, cached, fetchedAt]
    VendorInventoryRequest:
      type: object
      properties:
        vendor: { type: string, enum: [sanmar, ss] }
        style: { type: string, minLength: 1 }
        styleId:
          type: ["string", "null"]
          description: Vendor-internal id from the lookup result (S&S styleID). When set, inventory is read from exactly that product instead of re-searching by style number.
        catalogColor: { type: string, minLength: 1 }
        sizes:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1 }
      required: [vendor, style, catalogColor, sizes]
    VendorWarehouseAvailability:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        qty: { type: integer }
        capped:
          type: boolean
          description: True when the vendor caps the reported quantity (SanMar reports at most 3000 per warehouse — display "3000+").
      required: [code, name, qty, capped]
    VendorInventorySize:
      type: object
      properties:
        size: { type: string }
        found: { type: boolean }
        warehouses:
          type: array
          items:
            $ref: "#/components/schemas/VendorWarehouseAvailability"
      required: [size, found, warehouses]
    VendorInventoryResult:
      type: object
      properties:
        vendor: { type: string, enum: [sanmar, ss] }
        style: { type: string }
        catalogColor: { type: string }
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/VendorInventorySize"
        cached: { type: boolean }
        fetchedAt: { type: string }
      required: [vendor, style, catalogColor, sizes, cached, fetchedAt]
    PoFileSizeEntry:
      type: object
      properties:
        size: { type: string }
        qty: { type: integer, minimum: 0 }
        unitCost: { type: number }
        sku: { type: ["string", "null"] }
        inventoryKey: { type: ["string", "null"] }
        sizeIndex: { type: ["integer", "null"] }
      required: [size, qty, unitCost, sku, inventoryKey, sizeIndex]
    PoFileLineItem:
      type: object
      properties:
        printavoLineItemId: { type: ["string", "null"] }
        printavoOrderId: { type: ["string", "null"] }
        visualId: { type: ["integer", "null"] }
        styleNumber: { type: string }
        color: { type: ["string", "null"] }
        vendorCatalogColor: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        source: { type: string, enum: [vendor, manual] }
        warehouseCode:
          type: ["string", "null"]
          description: Vendor warehouse the whole line ships from (SanMar whseNo as string, S&S warehouse abbreviation). Optional — older POs and manual lines have none.
        warehouseName:
          type: ["string", "null"]
          description: Display name for the warehouse (e.g. "Dallas, TX").
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/PoFileSizeEntry"
      required: [printavoLineItemId, printavoOrderId, visualId, styleNumber, color, vendorCatalogColor, description, brand, source, sizes]
    PoPushLine:
      type: object
      properties:
        key: { type: string }
        printavoLineItemId: { type: ["string", "null"] }
        printavoOrderId: { type: ["string", "null"] }
        visualId: { type: ["integer", "null"] }
        styleNumber: { type: string }
        color: { type: ["string", "null"] }
        status:
          type: string
          enum: [pending, done, skipped_ordered, no_link, failed]
        detail: { type: ["string", "null"] }
      required: [key, printavoLineItemId, printavoOrderId, visualId, styleNumber, color, status, detail]
    PoPushState:
      type: object
      description: Progress of the latest push-to-Printavo cycle. A failed push can be retried — it resumes only the unfinished steps.
      properties:
        status:
          type: string
          enum: [running, success, failed]
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PoPushLine"
        attachedInvoiceIds:
          type: array
          items: { type: string }
        refreshedOrderIds:
          type: array
          items: { type: string }
      required: [status, startedAt, finishedAt, error, lines, attachedInvoiceIds, refreshedOrderIds]
    PushStartResponse:
      type: object
      properties:
        started: { type: boolean }
      required: [started]
    PoFile:
      type: object
      properties:
        id: { type: string }
        poNumber: { type: string }
        vendorName: { type: string }
        notes: { type: ["string", "null"] }
        totalQuantity: { type: integer }
        totalCost: { type: number }
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/PoFileLineItem"
        pushedToPrintavoAt: { type: ["string", "null"] }
        submittedToVendorAt: { type: ["string", "null"] }
        vendorOrderNumber:
          type: ["string", "null"]
          description: Vendor's order/confirmation number, recorded when the PO is marked submitted.
        locked: { type: boolean }
        lockReason:
          type: ["string", "null"]
          enum: [printavo, vendor, null]
          description: Why the PO is locked — "vendor" locks are permanent, "printavo" locks can be manually unlocked.
        pushState:
          anyOf:
            - $ref: "#/components/schemas/PoPushState"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, poNumber, vendorName, notes, totalQuantity, totalCost, lineItems, pushedToPrintavoAt, submittedToVendorAt, vendorOrderNumber, locked, lockReason, pushState, createdAt, updatedAt]
    PoFileList:
      type: object
      properties:
        poFiles:
          type: array
          items:
            $ref: "#/components/schemas/PoFile"
      required: [poFiles]
    SubmitPoToVendorRequest:
      type: object
      properties:
        vendorOrderNumber:
          type: ["string", "null"]
          description: Vendor's order/confirmation number from checkout (optional).
    CreatePoFileRequest:
      type: object
      properties:
        poNumber: { type: string, minLength: 1 }
        vendorName: { type: string, enum: [sanmar, ss, manual] }
        notes: { type: ["string", "null"] }
        lineItems:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PoFileLineItem"
      required: [poNumber, vendorName, lineItems]
    UpdatePoFileRequest:
      type: object
      properties:
        poNumber: { type: string, minLength: 1 }
        notes: { type: ["string", "null"] }
        lineItems:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PoFileLineItem"
    AppendPoLineItemsRequest:
      type: object
      properties:
        lineItems:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PoFileLineItem"
      required: [lineItems]
    ReportFilterOptions:
      type: object
      properties:
        statuses:
          type: array
          items: { type: string }
        brands:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        colors:
          type: array
          items: { type: string }
        styleNumbers:
          type: array
          items: { type: string }
        tiers:
          type: array
          items: { type: string }
        paymentTypes:
          type: array
          items: { type: string }
      required: [statuses, brands, categories, colors, styleNumbers, tiers, paymentTypes]
