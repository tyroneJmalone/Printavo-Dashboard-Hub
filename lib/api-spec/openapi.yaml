openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sync
    description: Printavo sync engine
  - name: printavo
    description: Printavo gateway
  - name: purchasing
    description: Purchasing / vendor orders module
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Sync engine status
      description: Local record counts, seed/poll run info, watermarks, scheduler and gateway stats
      responses:
        "200":
          description: Current sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
  /sync/events:
    get:
      operationId: listChangeEvents
      tags: [sync]
      summary: Recent change events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Change events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeEventItem"
  /sync/seed:
    post:
      operationId: startSeed
      tags: [sync]
      summary: Start or resume the initial 12-month seed
      responses:
        "200":
          description: Seed start result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedStartResult"
  /sync/poll:
    post:
      operationId: triggerPoll
      tags: [sync]
      summary: Run an incremental poll now
      description: >-
        Starts a manual incremental poll. Guard cases (another sync running,
        seed incomplete, credentials missing, immediate failure) return within
        ~1.5s with ran:false and an explanatory message. Otherwise responds
        immediately with ran:true / "Poll started" and stats:null while the
        poll continues in the background — watch GET /sync/status until
        lastIncremental leaves the "running" state.
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
  /printavo/probe:
    get:
      operationId: probePrintavo
      tags: [printavo]
      summary: One-request connectivity probe against Printavo
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
  /purchasing/needs-ordering:
    get:
      operationId: getNeedsOrdering
      tags: [purchasing]
      summary: Orders with line items needing ordering
      description: Scans synced pv_line_items for product_status='need_ordering', grouped by order
      responses:
        "200":
          description: Needs-ordering scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsOrderingResult"
  /purchasing/vendor-lookup:
    post:
      operationId: vendorLookup
      tags: [purchasing]
      summary: Live vendor catalog lookup by style
      description: Fetches all colors/sizes with cost and inventory for a style from SanMar or S&S Activewear. Cached in-memory ~15 minutes per vendor+style.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorLookupRequest"
      responses:
        "200":
          description: Unified vendor catalog result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorLookupResult"
        "503":
          description: Vendor credentials missing or vendor API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/vendor-inventory:
    post:
      operationId: vendorInventory
      tags: [purchasing]
      summary: Per-warehouse availability for a resolved style+color
      description: Live warehouse quantities for the given sizes of an exact vendor catalog color. SanMar quantities are capped at 3000 per warehouse (capped=true means "3000+"). Cached in-memory ~5 minutes per vendor+style+color.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInventoryRequest"
      responses:
        "200":
          description: Per-size warehouse availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInventoryResult"
        "503":
          description: Vendor credentials missing or vendor API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files:
    get:
      operationId: listPoFiles
      tags: [purchasing]
      summary: List saved purchase orders (newest first)
      responses:
        "200":
          description: PO file list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFileList"
    post:
      operationId: createPoFile
      tags: [purchasing]
      summary: Save a purchase order built from the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePoFileRequest"
      responses:
        "201":
          description: Created PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
  /purchasing/po-files/{id}:
    get:
      operationId: getPoFile
      tags: [purchasing]
      summary: Fetch one purchase order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePoFile
      tags: [purchasing]
      summary: Delete a purchase order (blocked while locked)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePoFile
      tags: [purchasing]
      summary: Update a PO — metadata (number, notes) and/or replace the line items (totals recomputed server-side). Blocked while locked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePoFileRequest"
      responses:
        "200":
          description: Updated PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked or the PO number is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/line-items:
    post:
      operationId: appendPoLineItems
      tags: [purchasing]
      summary: Append line items to an existing PO (totals recomputed server-side). Blocked while locked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendPoLineItemsRequest"
      responses:
        "200":
          description: Updated PO file with the appended lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/push:
    post:
      operationId: pushPoFile
      tags: [purchasing]
      summary: Start a background push of this PO to Printavo (marks linked lines Ordered, attaches the PO document to each invoice). Progress is reported via PoFile.pushState.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Push started (or resumed after a failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStartResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already running, or no Printavo-linked lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Printavo credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/submit-to-vendor:
    post:
      operationId: submitPoToVendor
      tags: [purchasing]
      summary: Mark a PO as submitted to the vendor — locks edits (only the admin unlock can remove it) — optionally recording the vendor's order/confirmation number.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPoToVendorRequest"
      responses:
        "200":
          description: Updated PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already submitted to the vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/vendor-submit:
    post:
      operationId: vendorSubmit
      tags: [purchasing]
      summary: Preview or electronically submit a PO to its vendor (SanMar submitPO / S&S orders). Defaults to a no-network dry-run preview; test and live modes require the admin PIN and are coerced to dry_run unless electronic submission is enabled on the server.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSubmitRequest"
      responses:
        "200":
          description: Submission result — preview, ineligible, submitted, failed, unknown, already_active, in_progress, or not_configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSubmitResult"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin PIN incorrect, or the admin PIN isn't set up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many wrong PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/unlock:
    post:
      operationId: unlockPoFile
      tags: [purchasing]
      summary: Manually unlock a PO that was pushed to Printavo. Vendor-submitted POs need the admin unlock instead.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Unlocked PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is not locked, or was submitted to the vendor (admin unlock required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/admin-unlock:
    post:
      operationId: adminUnlockPoFile
      tags: [purchasing]
      summary: Admin-only — un-mark a PO as submitted to the vendor (clears the vendor lock and the vendor order number). Requires the admin PIN.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUnlockPoFileRequest"
      responses:
        "200":
          description: Unlocked PO file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoFile"
        "403":
          description: Admin PIN missing, incorrect, or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PO is not vendor-locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/po-files/{id}/html:
    get:
      operationId: getPoFileHtml
      tags: [purchasing]
      summary: Printable PO document rendered on demand from the stored line items
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Printable PO document
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Not found
          content:
            text/html:
              schema: { type: string }
  /purchasing/printavo-statuses:
    get:
      operationId: listPrintavoStatuses
      tags: [purchasing]
      summary: All Printavo order statuses (from the local sync) for the rule target picker
      responses:
        "200":
          description: Statuses sorted by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintavoStatusesResponse"
  /purchasing/status-rules:
    get:
      operationId: listStatusRules
      tags: [purchasing]
      summary: Status rules ordered by priority (first match wins)
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusRulesResponse"
    post:
      operationId: createStatusRule
      tags: [purchasing]
      summary: Create a status rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusRuleRequest"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusRule"
        "400":
          description: Invalid rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/status-rules/{id}:
    patch:
      operationId: updateStatusRule
      tags: [purchasing]
      summary: Update a status rule (any subset of fields, including priority and enabled)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRuleRequest"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusRule"
        "400":
          description: Invalid rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStatusRule
      tags: [purchasing]
      summary: Delete a status rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/status-rules/reorder:
    post:
      operationId: reorderStatusRules
      tags: [purchasing]
      summary: Atomically renumber rule priorities to match the given order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderStatusRulesRequest"
      responses:
        "200":
          description: Rules in their new order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusRulesResponse"
        "400":
          description: Stale or invalid id list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/status-suggestions:
    get:
      operationId: listStatusSuggestions
      tags: [purchasing]
      summary: Suggested Printavo status changes (preview/confirm — nothing is applied automatically)
      parameters:
        - name: scope
          in: query
          required: false
          description: open (default) = pending + failed; all = recent history too
          schema: { type: string, enum: [open, all] }
      responses:
        "200":
          description: Suggestions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSuggestionsResponse"
  /purchasing/status-suggestions/evaluate:
    post:
      operationId: evaluateStatusSuggestions
      tags: [purchasing]
      summary: Re-evaluate rules now for orders on POs pushed in the last 30 days
      responses:
        "200":
          description: Evaluation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateStatusRulesResponse"
  /purchasing/status-suggestions/{id}/apply:
    post:
      operationId: applyStatusSuggestion
      tags: [purchasing]
      summary: Apply a suggestion — changes the order's status in Printavo via the shared gateway
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSuggestion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already applied/dismissed, order already in the target status, or the order's status changed since evaluation (snapshot refreshed — re-confirm)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Printavo rejected the status change (suggestion marked failed, retryable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyStatusSuggestionError"
        "503":
          description: Printavo credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /purchasing/status-suggestions/{id}/dismiss:
    post:
      operationId: dismissStatusSuggestion
      tags: [purchasing]
      summary: Dismiss a suggestion without writing to Printavo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSuggestion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already applied or dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/orders:
    get:
      operationId: getOrdersReport
      tags: [reports]
      summary: Filtered orders list with summary stats
      parameters:
        - $ref: "#/components/parameters/OrderTypeParam"
        - $ref: "#/components/parameters/StatusesParam"
        - $ref: "#/components/parameters/BrandsParam"
        - $ref: "#/components/parameters/CategoriesParam"
        - $ref: "#/components/parameters/StyleNumbersParam"
        - $ref: "#/components/parameters/ColorsParam"
        - $ref: "#/components/parameters/CreatedStartParam"
        - $ref: "#/components/parameters/CreatedEndParam"
        - $ref: "#/components/parameters/InvoiceStartParam"
        - $ref: "#/components/parameters/InvoiceEndParam"
        - $ref: "#/components/parameters/ProductionDueStartParam"
        - $ref: "#/components/parameters/ProductionDueEndParam"
        - $ref: "#/components/parameters/DueStartParam"
        - $ref: "#/components/parameters/DueEndParam"
        - $ref: "#/components/parameters/MinQtyParam"
        - $ref: "#/components/parameters/MaxQtyParam"
        - $ref: "#/components/parameters/MinTotalParam"
        - $ref: "#/components/parameters/MaxTotalParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/ExcludeParam"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Orders report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersReport"
  /reports/status-breakdown:
    get:
      operationId: getStatusBreakdown
      tags: [reports]
      summary: Revenue and quantity by order status
      parameters:
        - $ref: "#/components/parameters/OrderTypeParam"
        - $ref: "#/components/parameters/StatusesParam"
        - $ref: "#/components/parameters/BrandsParam"
        - $ref: "#/components/parameters/CategoriesParam"
        - $ref: "#/components/parameters/StyleNumbersParam"
        - $ref: "#/components/parameters/ColorsParam"
        - $ref: "#/components/parameters/CreatedStartParam"
        - $ref: "#/components/parameters/CreatedEndParam"
        - $ref: "#/components/parameters/InvoiceStartParam"
        - $ref: "#/components/parameters/InvoiceEndParam"
        - $ref: "#/components/parameters/ProductionDueStartParam"
        - $ref: "#/components/parameters/ProductionDueEndParam"
        - $ref: "#/components/parameters/DueStartParam"
        - $ref: "#/components/parameters/DueEndParam"
        - $ref: "#/components/parameters/MinQtyParam"
        - $ref: "#/components/parameters/MaxQtyParam"
        - $ref: "#/components/parameters/MinTotalParam"
        - $ref: "#/components/parameters/MaxTotalParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/ExcludeParam"
      responses:
        "200":
          description: Breakdown report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownReport"
  /reports/pricing-matrix-breakdown:
    get:
      operationId: getPricingMatrixBreakdown
      tags: [reports]
      summary: Imprint revenue by pricing matrix and column
      parameters:
        - $ref: "#/components/parameters/OrderTypeParam"
        - $ref: "#/components/parameters/StatusesParam"
        - $ref: "#/components/parameters/BrandsParam"
        - $ref: "#/components/parameters/CategoriesParam"
        - $ref: "#/components/parameters/StyleNumbersParam"
        - $ref: "#/components/parameters/ColorsParam"
        - $ref: "#/components/parameters/CreatedStartParam"
        - $ref: "#/components/parameters/CreatedEndParam"
        - $ref: "#/components/parameters/InvoiceStartParam"
        - $ref: "#/components/parameters/InvoiceEndParam"
        - $ref: "#/components/parameters/ProductionDueStartParam"
        - $ref: "#/components/parameters/ProductionDueEndParam"
        - $ref: "#/components/parameters/DueStartParam"
        - $ref: "#/components/parameters/DueEndParam"
        - $ref: "#/components/parameters/MinQtyParam"
        - $ref: "#/components/parameters/MaxQtyParam"
        - $ref: "#/components/parameters/MinTotalParam"
        - $ref: "#/components/parameters/MaxTotalParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/ExcludeParam"
      responses:
        "200":
          description: Breakdown report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownReport"
  /reports/imprints-by-tier:
    get:
      operationId: getImprintsByTier
      tags: [reports]
      summary: Imprint revenue by pricing tier (matrix column)
      parameters:
        - $ref: "#/components/parameters/OrderTypeParam"
        - $ref: "#/components/parameters/StatusesParam"
        - $ref: "#/components/parameters/BrandsParam"
        - $ref: "#/components/parameters/CategoriesParam"
        - $ref: "#/components/parameters/StyleNumbersParam"
        - $ref: "#/components/parameters/ColorsParam"
        - $ref: "#/components/parameters/CreatedStartParam"
