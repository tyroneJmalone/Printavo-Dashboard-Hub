      properties:
        input: { type: string }
        vendor: { type: string, enum: [sanmar, ss] }
        styleName: { type: string }
        styleId: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        styleImage: { type: ["string", "null"] }
        sizes: { type: array, items: { type: string } }
        sizeRange: { type: ["string", "null"] }
        colors: { type: array, maxItems: 12, items: { $ref: "#/components/schemas/PaletteColorSuggestion" } }
        alternatives: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/PaletteColorSuggestion" } }
    PaletteCollectionPreviewResponse:
